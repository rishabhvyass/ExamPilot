<title>ExamPilot reference — earlier-splash-static</title>
<!-- Static snapshot of the design prototype (Splash.dc.html) in its first state. Reference only: rebuild as React components. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.rise{opacity:0;animation:rise 520ms cubic-bezier(.05,.7,.1,1) forwards}
.d1{animation-delay:80ms}.d2{animation-delay:200ms}.d3{animation-delay:320ms}.d4{animation-delay:440ms}
.float{animation:float 6s ease-in-out infinite}
.press{transition:transform 120ms cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(0.97)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
a:focus-visible{outline:3px solid #1B1B1F;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;animation:none}.float{animation:none}.press{transition:none}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}

</style>
</head>
