<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamPilot reference — M1-email-code-pill</title>
<!-- Static snapshot of the design prototype (MotionVerify.dc.html) in its first state. Reference only: rebuild as React components. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.pill{transition:width 420ms cubic-bezier(.2,.9,.25,1.08),background-color 280ms ease,box-shadow 280ms ease}
.morph{animation:morph 260ms cubic-bezier(.2,.8,.2,1) both}
.digit{animation:digit 220ms cubic-bezier(.2,.9,.25,1.2) both}
.caret{animation:caret 1s steps(1) infinite}
.spin{animation:spin .8s linear infinite}
.shimmer{background:linear-gradient(90deg,#5B6475 0%,#5B6475 35%,#C6CCD7 50%,#5B6475 65%,#5B6475 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.2s linear infinite}
.shake{animation:shake 420ms cubic-bezier(.36,.07,.19,.97) both}
.shine{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);animation:shine 900ms 250ms ease-in-out both}
.tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 300ms 120ms ease-out forwards}
.cell{transition:background-color 200ms ease,box-shadow 200ms ease,color 200ms ease}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.97)}
.rise{animation:rise 420ms cubic-bezier(.05,.7,.1,1) both}
@keyframes morph{from{opacity:0;filter:blur(6px);transform:scale(.96)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes digit{from{opacity:0;filter:blur(4px);transform:scale(.6) translateY(4px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes shine{from{left:-70px}to{left:110%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
.codeinput{position:absolute;inset:0;opacity:0;font-size:16px;border:0;width:100%;height:100%;cursor:text}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition:none!important}.spin,.shimmer{animation:none!important;color:#5B6475}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}

</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">
<main style="padding: 60px 24px 32px; display: flex; flex-direction: column; gap: 18px; height: 100%; box-sizing: border-box">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Login.dc.html" class="press" aria-label="Back" style="width: 52px; height: 52px; border-radius: 999px; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 14px; font-weight: 600; color: #5B6475">Verify email</span>
</div>

<header style="display: flex; flex-direction: column; gap: 8px; padding-top: 18px">
<h1 style="margin: 0; font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em">Check your<br>email</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #5B6475">We sent a 6-digit code to <strong style="font-weight: 600; color: #1B1B1F">you@college.edu</strong>. It works for 10 minutes.</p>
</header>

<div style="height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
<div class="pill " style="position: relative; overflow: hidden; height: 60px; width: 168px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 10px 26px rgba(15,23,42,.10); display: flex; align-items: center; justify-content: center">


<button type="button" class="morph" style="position: absolute; inset: 0; border: 0; background: transparent; font: inherit; font-size: 17px; font-weight: 600; color: #1B1B1F; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Enter code</button>







</div>

<p role="status" style="margin: 0; height: 20px; font-size: 15px; font-weight: 500; color: #5B6475"></p>
</div>



<button type="button" style="align-self: center; height: 44px; padding: 0 14px; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #5B6475; cursor: pointer">Didn’t get it? Resend in 0:30</button>


<div style="margin-top: auto; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: #6B7385">Prototype demo</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" class="press" style="height: 48px; border-radius: 999px; border: 0; background: #D9F5E6; color: #065F46; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Correct code</button>
<button type="button" class="press" style="height: 48px; border-radius: 999px; border: 0; background: #EDE5FF; color: #5B21B6; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Wrong code</button>
</div>
<button type="button" class="press" style="height: 44px; border-radius: 999px; border: 1.5px solid #CBD2DC; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #1B1B1F; cursor: pointer">Reset</button>
</div>

</main>
</div>

</body>
</html>
