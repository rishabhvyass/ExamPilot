<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamPilot reference — M6-split-tab-bar</title>
<!-- Static snapshot of the design prototype (MotionTabBar.dc.html) in its first state. Reference only: rebuild as React components. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.tab{transition:margin-left 460ms cubic-bezier(.3,1.35,.45,1),border-radius 460ms cubic-bezier(.3,1.35,.45,1),background-color 260ms ease,color 260ms ease,padding 460ms cubic-bezier(.3,1.35,.45,1),box-shadow 260ms ease,transform 140ms cubic-bezier(.2,0,0,1)}
.tab:hover{filter:brightness(.97)}
.tab:active{transform:scale(.95)}
.screen{animation:screen 380ms cubic-bezier(.2,.8,.2,1) both}
@keyframes screen{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
button:focus-visible{outline:3px solid #3B82F6;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.tab{transition:background-color 120ms ease,color 120ms ease}.screen{animation:none}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}

</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">



<main class="screen" style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between"><span style="width: 56px; height: 56px; border-radius: 999px; background: #DCEBFF"></span><span style="width: 56px; height: 56px; border-radius: 999px; background: #FFFFFF"></span></div>
<span style="font-size: 20px; font-weight: 500; color: #5B6475; padding: 10px 4px 0">Good morning</span>
<h1 style="margin: 0 4px; font-weight: 600; font-size: 46px; line-height: 1.02; letter-spacing: -0.03em; white-space: pre-line">Your Exam
Week</h1>
<div style="height: 250px; border-radius: 34px; background: #DCEBFF"></div>
<div style="height: 68px; border-radius: 999px; background: #FFFFFF"></div>
<div style="height: 68px; border-radius: 999px; background: #FFFFFF; opacity: .7"></div>
</main>









<div style="position: absolute; left: 16px; right: 16px; bottom: 92px; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); border-radius: 26px; padding: 14px 16px; font-size: 13px; line-height: 1.5; color: #5B6475; box-shadow: 0 8px 20px rgba(15,23,42,.06)">The active tab breaks away into its own black pill; the others regroup on either side. Springs: 460 ms, slight overshoot.</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center">
<div style="display: flex; align-items: center; padding: 4px; border-radius: 999px">

<button type="button" class="tab" aria-current="page" style="height: 48px; margin-left: 0px; padding: 0 14px; border: 0; border-radius: 24px 24px 24px 24px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); color: #FFFFFF; box-shadow: 0 8px 20px rgba(27,27,31,.25); font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg>Today
</button>

<button type="button" class="tab" aria-current="false" style="height: 48px; margin-left: 8px; padding: 0 10px; border: 0; border-radius: 24px 0px 0px 24px; background: #FFFFFF; color: #5B6475; box-shadow: 0 6px 16px rgba(15,23,42,.06); font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h10a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z"></path><path d="M16 3v4M8 3v4M3 10h18"></path></svg>Calendar
</button>

<button type="button" class="tab" aria-current="false" style="height: 48px; margin-left: 0px; padding: 0 10px; border: 0; border-radius: 0px 0px 0px 0px; background: #FFFFFF; color: #5B6475; box-shadow: 0 6px 16px rgba(15,23,42,.06); font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM17 3.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path><path d="M7 13.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM17 13.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg>Subjects
</button>

<button type="button" class="tab" aria-current="false" style="height: 48px; margin-left: 0px; padding: 0 10px; border: 0; border-radius: 0px 24px 24px 0px; background: #FFFFFF; color: #5B6475; box-shadow: 0 6px 16px rgba(15,23,42,.06); font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8a5 5 0 0 1 5 5v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z"></path><path d="M8 10h8M8 14h5"></path></svg>Questions
</button>

</div>
</nav>
</div>

</body>
</html>
