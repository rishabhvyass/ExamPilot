<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamPilot reference — M3-onboarding-carousel</title>
<!-- Static snapshot of the design prototype (MotionOnboarding.dc.html) in its first state. Reference only: rebuild as React components. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1),background-color 200ms ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.94)}
.txt{animation:txt 460ms cubic-bezier(.2,.8,.2,1) both}
.drop{animation:drop 720ms cubic-bezier(.2,.9,.25,1.12) both}
.swing{transform-origin:50% -20px;animation:swing 900ms cubic-bezier(.2,.9,.25,1.1) both}
.popin{animation:popin 520ms cubic-bezier(.2,.9,.25,1.35) both}
.rise{animation:rise 700ms cubic-bezier(.2,.9,.25,1.08) both}
.grow{transform-origin:left;animation:grow 800ms cubic-bezier(.2,.8,.2,1) both}
.ghost{animation:ghost 900ms ease both}
.coin{transition:left 620ms cubic-bezier(.3,1.35,.45,1)}
.fill{transition:width 620ms cubic-bezier(.2,.8,.2,1)}
.coinfall{animation:coinfall 1100ms 500ms cubic-bezier(.5,0,.6,1.3) both}
.cupbump{animation:cupbump 500ms 1500ms cubic-bezier(.2,.9,.25,1.4) both}
.sparkle{animation:sparkle 700ms 1550ms ease-out both}
.float{animation:float 4s ease-in-out infinite}
@keyframes txt{from{opacity:0;filter:blur(6px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-120px) rotate(var(--r0,0deg))}to{opacity:1;transform:translateY(0) rotate(var(--r1,0deg))}}
@keyframes swing{0%{opacity:0;transform:translate(60px,-140px) rotate(28deg)}60%{opacity:1;transform:translate(0,6px) rotate(-6deg)}100%{transform:rotate(-4deg)}}
@keyframes popin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ghost{from{opacity:0;transform:translateY(-10px)}to{opacity:.55;transform:none}}
@keyframes coinfall{0%{opacity:0;transform:translateY(-190px) rotateY(0)}15%{opacity:1}80%{transform:translateY(0) rotateY(540deg)}100%{opacity:0;transform:translateY(26px) rotateY(720deg) scale(.6)}}
@keyframes cupbump{0%{transform:none}40%{transform:scale(1.06,.94) translateY(4px)}100%{transform:none}}
@keyframes sparkle{from{opacity:0;transform:scale(.4)}60%{opacity:1}to{opacity:0;transform:scale(1.4)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition:none!important}.coinfall,.sparkle{display:none}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}

</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">


<div style="position: absolute; left: 16px; right: 16px; top: 58px; height: 440px; border-radius: 34px; background: linear-gradient(180deg, #E0ECFF 0%, #F1F6FF 100%); overflow: hidden" aria-hidden="true">


<div style="position: absolute; inset: 0">


<div style="position: absolute; inset: 0">

<div class="drop" style="--r0: -12deg; --r1: -3deg; animation-delay: 280ms; position: absolute; left: 70px; top: 230px; width: 200px; height: 150px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 16px 34px rgba(30,58,138,.16); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px"><span style="width: 58px; height: 58px; border-radius: 18px; background: #D9F5E6; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1"><span style="font-size: 22px; font-weight: 700">23</span><span style="font-size: 11px; font-weight: 700; color: #065F46">OCT</span></span><span style="font-size: 17px; font-weight: 600">Data Structures</span></div>
<span class="popin" style="animation-delay: 620ms; position: absolute; right: 30px; top: 50px; height: 40px; padding: 0 16px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>Plan ready</span>
</div>








</div>








</div>

<div style="position: absolute; left: 24px; right: 24px; top: 528px; text-align: center; display: flex; flex-direction: column; gap: 10px">


<div class="txt" style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #6B7385">SMART PLANNING</span>
<h1 style="margin: 0; font-size: 31px; font-weight: 600; line-height: 1.12; letter-spacing: -0.02em; white-space: pre-line">Plan around

<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5B6475">Add your admit card and we’ll build a calm day-by-day plan.</p>

</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 30px; height: 60px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
<button type="button" class="press" aria-label="Previous" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #E8EBF0; color: #A0A8B8; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<div role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-label="Onboarding progress" style="position: relative; width: 168px; height: 30px">
<span style="position: absolute; left: 0; right: 0; top: 13px; height: 4px; border-radius: 999px; background: #E2E6EC"></span>
<span class="fill" style="position: absolute; left: 0; top: 13px; height: 4px; border-radius: 999px; background: #3B82F6; width: 0%"></span>
<span style="position: absolute; left: 0; top: 10px; width: 10px; height: 10px; margin-left: -5px; border-radius: 999px; background: #3B82F6"></span>
<span style="position: absolute; left: 33.3%; top: 10px; width: 10px; height: 10px; margin-left: -5px; border-radius: 999px; background: #E2E6EC"></span>
<span style="position: absolute; left: 66.6%; top: 10px; width: 10px; height: 10px; margin-left: -5px; border-radius: 999px; background: #E2E6EC"></span>
<span style="position: absolute; left: 100%; top: 10px; width: 10px; height: 10px; margin-left: -5px; border-radius: 999px; background: #E2E6EC"></span>
<span class="coin" style="position: absolute; left: 0%; top: 0; width: 30px; height: 30px; margin-left: -15px; border-radius: 999px; background: #3B82F6; box-shadow: 0 0 0 3px #FFFFFF, 0 6px 14px rgba(30,58,138,.3); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"></path></svg></span>
</div>
<button type="button" class="press" aria-label="Next" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
