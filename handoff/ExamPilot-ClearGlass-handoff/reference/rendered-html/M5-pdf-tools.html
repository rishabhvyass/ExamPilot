body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.panel{transition:width 440ms cubic-bezier(.3,1.2,.45,1),height 440ms cubic-bezier(.3,1.2,.45,1),border-radius 440ms ease}
.layer{transition:opacity 220ms ease,filter 260ms ease,transform 380ms cubic-bezier(.3,1.2,.45,1)}
.btn{transition:transform 360ms cubic-bezier(.3,1.4,.45,1),background-color 200ms ease}
.btn:active{transform:scale(.88)}
.flash{animation:flash 520ms ease both}
.tool{transition:background-color 220ms ease,transform 140ms cubic-bezier(.2,0,0,1)}
.tool:hover{background:rgba(255,255,255,.08)}
.tool:active{transform:scale(.92)}
.mark{transition:background-color 320ms ease}
.hint{animation:hint 1.8s ease both}
@keyframes flash{0%{background:#FFFFFF}100%{background:#3A3A42}}
@keyframes hint{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
button:focus-visible,a:focus-visible{outline:3px solid #3B82F6;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.panel,.layer,.btn,.tool,.mark{transition:opacity 150ms ease!important}.flash{animation:none}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}

</style>

<h2 style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em">Cohesion and coupling</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65">Cohesion measures how related a module’s responsibilities are. Coupling measures how much modules depend on one another.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.65"><span class="mark" style="background: transparent; border-radius: 6px; padding: 1px 3px">Aim for high cohesion and low coupling.</span> Changes then stay small and testing stays simple.</p>
