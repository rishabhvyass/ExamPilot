<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — Subjects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.press{transition:transform 120ms cubic-bezier(.2,0,0,1),background-color 150ms ease}
.press:active{transform:scale(0.97)}
.pop{animation:pop 260ms cubic-bezier(.2,0,0,1)}
.draw path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 220ms 60ms ease-out forwards}
.fadeup{animation:fadeup 280ms cubic-bezier(.05,.7,.1,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.press:hover{transform:translateY(-1px)}.press:hover:active{transform:scale(.97)}
main{animation:pagein 360ms cubic-bezier(.2,.8,.2,1) both}
.tabpill{overflow:hidden;white-space:nowrap;animation:tabin 520ms cubic-bezier(.2,.9,.25,1.04) both}
.tablabel{animation:tablabel 320ms 180ms cubic-bezier(.05,.7,.1,1) both}
nav a:not(.tabpill){transition:background-color 180ms ease,transform 140ms cubic-bezier(.2,0,0,1)}
nav a:not(.tabpill):hover{background:#FFFFFF}
nav a:not(.tabpill):active{transform:scale(.92)}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tabin{from{max-width:56px}to{max-width:320px}}
@keyframes tablabel{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.draw path{stroke-dashoffset:0}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}
</style>
</helmet>
<div style="width: 390px; height: 1560px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">
<main style="padding: 60px 20px 128px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 999px; background: #DCEBFF; color: #1E3A8A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
<span style="display: flex; gap: 8px">
<button type="button" class="press" aria-label="Search topics" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); color: #1B1B1F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button type="button" class="press" aria-label="More" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); color: #1B1B1F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</span>
</div>

<header style="display: flex; flex-direction: column; gap: 6px; padding: 14px 4px 6px">
<span style="font-size: 20px; font-weight: 500; color: #5B6475">Sample syllabus</span>
<h1 style="margin: 0; font-weight: 600; font-size: 46px; line-height: 1.02; letter-spacing: -0.03em">Your Custom<br>Syllabus</h1>
</header>

<div role="group" aria-label="Choose subject" style="display: flex; gap: 8px; align-items: center">
<span aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg></span>
<sc-for list="{{subjects}}" as="c" hint-placeholder-count="3">
<sc-if value="{{c.active}}" hint-placeholder-val="{{false}}"><button type="button" class="press" onClick="{{c.pick}}" aria-pressed="true" style="height: 52px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #1B1B1F; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{c.code}}</button></sc-if>
<sc-if value="{{c.inactive}}" hint-placeholder-val="{{true}}"><button type="button" class="press" onClick="{{c.pick}}" aria-pressed="false" style="height: 52px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #CBD2DC; background: transparent; color: #1B1B1F; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer">{{c.code}}</button></sc-if>
</sc-for>
</div>

<section aria-label="{{cur.name}}" class="fadeup" style="display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{cur.isSE}}" hint-placeholder-val="{{true}}"><dc-import name="SubjectHero" subject="{{cur}}" tint="#DCEBFF" sub-color="#1E40AF" panel="#BFD6FF" art-a="#3B82F6" art-b="#DDD0FF" hint-size="100%,330px"></dc-import></sc-if>
<sc-if value="{{cur.isDAA}}" hint-placeholder-val="{{false}}"><dc-import name="SubjectHero" subject="{{cur}}" tint="#EDE5FF" sub-color="#5B21B6" panel="#D4C4FF" art-a="#A78BFA" art-b="#DCEBFF" hint-size="100%,330px"></dc-import></sc-if>
<sc-if value="{{cur.isDDS}}" hint-placeholder-val="{{false}}"><dc-import name="SubjectHero" subject="{{cur}}" tint="#D9F5E6" sub-color="#065F46" panel="#B3EBCF" art-a="#34D399" art-b="#EDE5FF" hint-size="100%,330px"></dc-import></sc-if>

<div style="background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); border-radius: 34px; padding: 22px 20px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-weight: 600; font-size: 24px; letter-spacing: -0.02em">Topics</h2>
<span style="font-size: 15px; color: #5B6475">{{cur.count}}</span>
</div>
<p style="margin: 0 0 4px; font-size: 15px; line-height: 1.45; color: #5B6475">{{cur.milestone}}</p>
<sc-for list="{{cur.topics}}" as="t" hint-placeholder-count="6">
<button type="button" class="press" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 4px 2px; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer">
<sc-if value="{{t.done}}" hint-placeholder-val="{{false}}"><span class="pop draw" style="flex: none; width: 28px; height: 28px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%);  display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span><span style="font-size: 17px; font-weight: 500; color: #6B7385; text-decoration: line-through; text-decoration-color: #A0A8B8">{{t.name}}</span></sc-if>
<sc-if value="{{t.notDone}}" hint-placeholder-val="{{true}}"><span style="flex: none; width: 28px; height: 28px; border-radius: 999px; border: 2px solid #C2C9D4; box-sizing: border-box"></span><span style="font-size: 17px; font-weight: 500; color: #1B1B1F">{{t.name}}</span></sc-if>
</button>
</sc-for>
</div>

<div style="background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); border-radius: 34px; padding: 22px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-weight: 600; font-size: 24px; letter-spacing: -0.02em">Notes &amp; PDFs</h2>
<p style="margin: 0; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); border-radius: 22px; padding: 14px 16px; font-size: 16px; line-height: 1.55">{{cur.note}}</p>
<sc-for list="{{cur.pdfs}}" as="p" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 999px; padding: 6px 16px 6px 6px">
<span style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.name}}</span><span style="font-size: 13px; color: #5B6475">{{p.meta}}</span></span>
</div>
</sc-for>
<button type="button" class="press" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; border: 1.5px dashed #CBD2DC; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #1B1B1F; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a PDF</button>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
<span style="padding: 0 4px; font-size: 15px; font-weight: 500; color: #5B6475">Also in your syllabus</span>
<sc-for list="{{others}}" as="o" hint-placeholder-count="2">
<div>
<sc-if value="{{o.isSE}}" hint-placeholder-val="{{false}}"><button type="button" class="press" onClick="{{o.pick}}" style="width: 100%; display: flex; align-items: center; gap: 14px; border: 0; background: #DCEBFF; border-radius: 999px; padding: 8px 20px 8px 8px; font: inherit; color: #1B1B1F; text-align: left; cursor: pointer"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #BFD6FF; color: #1E3A8A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">SE</span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{o.name}}</span><span style="font-size: 14px; color: #1E40AF">{{o.count}}</span></span></button></sc-if>
<sc-if value="{{o.isDAA}}" hint-placeholder-val="{{true}}"><button type="button" class="press" onClick="{{o.pick}}" style="width: 100%; display: flex; align-items: center; gap: 14px; border: 0; background: #EDE5FF; border-radius: 999px; padding: 8px 20px 8px 8px; font: inherit; color: #1B1B1F; text-align: left; cursor: pointer"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #CDBBFF; color: #5B21B6; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">DAA</span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.name}}</span><span style="font-size: 14px; color: #5B21B6">{{o.count}}</span></span></button></sc-if>
<sc-if value="{{o.isDDS}}" hint-placeholder-val="{{false}}"><button type="button" class="press" onClick="{{o.pick}}" style="width: 100%; display: flex; align-items: center; gap: 14px; border: 0; background: #D9F5E6; border-radius: 999px; padding: 8px 20px 8px 8px; font: inherit; color: #1B1B1F; text-align: left; cursor: pointer"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #9EE6C0; color: #065F46; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">DDS</span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{o.name}}</span><span style="font-size: 14px; color: #065F46">{{o.count}}</span></span></button></sc-if>
</div>
</sc-for>
</div>

</main>

<nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px; background: linear-gradient(180deg, #FFFFFF, #F0F0F2); box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 1px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.05), 0 16px 34px rgba(0,0,0,.10)">
<a href="Main.dc.html" aria-label="Today" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: transparent; box-shadow: none; border: 1px solid #E8EBF0; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg></a>
<a href="Calendar.dc.html" aria-label="Calendar" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: transparent; box-shadow: none; border: 1px solid #E8EBF0; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg></a>
<a href="Subjects.dc.html" aria-current="page" class="tabpill" style="flex: 1; height: 56px; border-radius: 999px; color: #111113; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 16px; font-weight: 600; background: linear-gradient(180deg, #DEDEE1, #E9E9EB); box-shadow: inset 0 2px 6px rgba(0,0,0,.13), inset 0 -1px 0 rgba(255,255,255,.9);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="7" r="3.5"></circle><circle cx="17" cy="7" r="3.5"></circle><circle cx="7" cy="17" r="3.5"></circle><circle cx="17" cy="17" r="3.5"></circle></svg><span class="tablabel">Subjects</span></a>
<a href="Questions.dc.html" aria-label="Questions" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: transparent; box-shadow: none; border: 1px solid #E8EBF0; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="5"></rect><path d="M8 10h8M8 14h5"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      cur: 0,
      done: [
        [true, true, true, true, false, false],
        [true, true, true, false, false, false, false],
        [true, true, false, false, false, false, false]
      ]
    };
  }
  renderVals() {
    var self = this;
    var DATA = [
      { code: 'SE', name: 'Software Engineering', desc: 'Process models, requirements, design, testing and quality.', exam: '21 Oct',
        topics: ['Software process models', 'Requirements engineering', 'Design & UML diagrams', 'Testing strategies', 'Project estimation (COCOMO)', 'Maintenance & quality'],
        note: 'Sample note: Verification asks “are we building it right?”, validation asks “are we building the right thing?”',
        pdfs: [{ name: 'SE_Unit3_Design_UML.pdf', meta: 'Sample · 2.1 MB' }, { name: 'SE_previous_papers.pdf', meta: 'Sample · 840 KB' }] },
      { code: 'DAA', name: 'Design and Analysis of Algorithm', desc: 'Complexity, paradigms and graph algorithms.', exam: '22 Oct',
        topics: ['Asymptotic analysis', 'Divide & conquer', 'Greedy algorithms', 'Dynamic programming', 'Graph algorithms', 'Backtracking & branch-and-bound', 'NP-completeness'],
        note: 'Sample note: Greedy needs the greedy-choice property; DP needs overlapping subproblems.',
        pdfs: [{ name: 'DAA_DP_problems.pdf', meta: 'Sample · 1.4 MB' }] },
      { code: 'DDS', name: 'Design of Data Structures', desc: 'Linear structures, trees, heaps, hashing and graphs.', exam: '23 Oct',
        topics: ['Arrays & linked lists', 'Stacks & queues', 'Trees & BST', 'AVL & B-trees', 'Heaps', 'Hashing', 'Graphs'],
        note: 'Sample note: AVL balance factor stays within −1, 0, +1 after every insert.',
        pdfs: [{ name: 'DDS_Trees_cheatsheet.pdf', meta: 'Sample · 620 KB' }] }
    ];
    function milestone(p) {
      if (p >= 100) return 'Everything revised. Now rest and let it settle.';
      if (p >= 75) return 'Three-quarters done. You’re closer than you think.';
      if (p >= 50) return 'Halfway there. The second half feels easier from here.';
      if (p >= 25) return 'A quarter of the way there. Good start.';
      return 'One topic at a time.';
    }
    var list = DATA.map(function (s, si) {
      var d = self.state.done[si];
      var n = d.filter(Boolean).length;
      return {
        code: s.code, name: s.name, desc: s.desc, exam: s.exam, note: s.note, pdfs: s.pdfs,
        pdfCount: s.pdfs.length, topicStat: n + '/' + s.topics.length,
        isSE: s.code === 'SE', isDAA: s.code === 'DAA', isDDS: s.code === 'DDS',
        count: n + ' of ' + s.topics.length + ' topics revised',
        milestone: milestone(Math.round(n / s.topics.length * 100)),
        active: self.state.cur === si, inactive: self.state.cur !== si,
        pick: function () { self.setState({ cur: si }); },
        segs: s.topics.map(function (t, ti) { return { on: !!d[ti], off: !d[ti] }; }),
        topics: s.topics.map(function (t, ti) {
          var on = !!d[ti];
          return {
            name: t, done: on, notDone: !on, pressed: on ? 'true' : 'false',
            toggle: function () {
              var all = self.state.done.map(function (row) { return row.slice(); });
              all[si][ti] = !all[si][ti];
              self.setState({ done: all });
            }
          };
        })
      };
    });
    return {
      subjects: list,
      cur: list[this.state.cur],
      others: list.filter(function (x, i) { return i !== self.state.cur; })
    };
  }
}
</script>
</body>
</html>
