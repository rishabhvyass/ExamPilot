<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.press{transition:transform 120ms cubic-bezier(.2,0,0,1),background-color 150ms ease}
.press:active{transform:scale(0.96)}
.fadeup{animation:fadeup 260ms cubic-bezier(.05,.7,.1,1)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.press:hover{transform:translateY(-1px)}.press:hover:active{transform:scale(.97)}
main{animation:pagein 360ms cubic-bezier(.2,.8,.2,1) both}
.tabpill{overflow:hidden;white-space:nowrap;animation:tabin 520ms cubic-bezier(.2,.9,.25,1.04) both}
.tablabel{animation:tablabel 320ms 180ms cubic-bezier(.05,.7,.1,1) both}
nav a:not(.tabpill){transition:background-color 180ms ease,transform 140ms cubic-bezier(.2,0,0,1)}
nav a:not(.tabpill):hover{background:#FFFFFF}
nav a:not(.tabpill):active{transform:scale(.92)}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tabin{from{max-width:56px}to{max-width:320px}}
@keyframes tablabel{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">
<main style="padding: 60px 20px 128px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" class="press" onClick="{{goToday}}" style="height: 56px; padding: 0 22px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); font: inherit; font-size: 16px; font-weight: 600; color: #1B1B1F; cursor: pointer">Today</button>
<span style="display: flex; gap: 8px">
<button type="button" class="press" onClick="{{prev}}" aria-label="Previous month" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); color: #1B1B1F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" class="press" onClick="{{next}}" aria-label="Next month" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); color: #1B1B1F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</span>
</div>

<header style="display: flex; flex-direction: column; gap: 6px; padding: 14px 4px 6px">
<span style="font-size: 20px; font-weight: 500; color: #5B6475">Calendar · {{year}}</span>
<h1 aria-live="polite" style="margin: 0; font-weight: 600; font-size: 46px; line-height: 1.02; letter-spacing: -0.03em">{{monthName}}</h1>
</header>

<section aria-label="Month" style="background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); border-radius: 34px; padding: 18px 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 13px; font-weight: 500; color: #6B7385" aria-hidden="true">
<span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<button type="button" onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" class="press" style="height: 50px; border: 0; background: transparent; padding: 0; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<sc-if value="{{c.isSel}}" hint-placeholder-val="{{false}}"><span style="width: 38px; height: 38px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%);  color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{c.day}}</span></sc-if>
<sc-if value="{{c.isToday}}" hint-placeholder-val="{{false}}"><span style="width: 38px; height: 38px; border-radius: 999px; box-shadow: inset 0 0 0 2px #1B1B1F; color: #1B1B1F; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{c.day}}</span></sc-if>
<sc-if value="{{c.isPlain}}" hint-placeholder-val="{{true}}"><span style="width: 38px; height: 38px; border-radius: 999px; color: #1B1B1F; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{c.day}}</span></sc-if>
<sc-if value="{{c.isOther}}" hint-placeholder-val="{{false}}"><span style="width: 38px; height: 38px; border-radius: 999px; color: #B8C0CC; font-size: 16px; display: flex; align-items: center; justify-content: center">{{c.day}}</span></sc-if>
<span style="height: 6px; display: flex; gap: 3px; align-items: center" aria-hidden="true">
<sc-if value="{{c.examSE}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 6px; border-radius: 999px; background: #2563EB"></span></sc-if>
<sc-if value="{{c.examDAA}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 6px; border-radius: 999px; background: #7C3AED"></span></sc-if>
<sc-if value="{{c.examDDS}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 6px; border-radius: 999px; background: #10B981"></span></sc-if>
<sc-if value="{{c.hasStudy}}" hint-placeholder-val="{{false}}"><span style="width: 6px; height: 6px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px #6B7385"></span></sc-if>
</span>
</button>
</sc-for>
</div>
<div style="display: flex; gap: 18px; justify-content: center; font-size: 13px; color: #5B6475; padding-top: 6px">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 6px; border-radius: 999px; background: #2563EB"></span>Exam</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px #6B7385"></span>Study session</span>
</div>
</section>

<section aria-label="Selected day" class="fadeup" style="display: flex; flex-direction: column; gap: 10px; padding-top: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<h2 style="margin: 0; font-weight: 600; font-size: 24px; letter-spacing: -0.02em">{{selLabel}}</h2>
<button type="button" class="press" aria-label="Add study session" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<sc-for list="{{events}}" as="e" hint-placeholder-count="2">
<div>
<sc-if value="{{e.examSE}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 14px; background: #DCEBFF; border-radius: 999px; padding: 8px 20px 8px 8px"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">2 PM</span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{e.title}}</span><span style="font-size: 14px; color: #1E40AF">{{e.meta}}</span></span></div></sc-if>
<sc-if value="{{e.examDAA}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 14px; background: #EDE5FF; border-radius: 999px; padding: 8px 20px 8px 8px"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">2 PM</span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{e.title}}</span><span style="font-size: 14px; color: #5B21B6">{{e.meta}}</span></span></div></sc-if>
<sc-if value="{{e.examDDS}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 14px; background: #D9F5E6; border-radius: 999px; padding: 8px 20px 8px 8px"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">2 PM</span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{e.title}}</span><span style="font-size: 14px; color: #065F46">{{e.meta}}</span></span></div></sc-if>
<sc-if value="{{e.isStudy}}" hint-placeholder-val="{{true}}"><div style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 999px; padding: 8px 20px 8px 8px">
<sc-if value="{{e.isSE}}" hint-placeholder-val="{{true}}"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #DCEBFF; color: #1E3A8A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">SE</span></sc-if>
<sc-if value="{{e.isDAA}}" hint-placeholder-val="{{false}}"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #EDE5FF; color: #5B21B6; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">DAA</span></sc-if>
<sc-if value="{{e.isDDS}}" hint-placeholder-val="{{false}}"><span style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #D9F5E6; color: #065F46; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">DDS</span></sc-if>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{e.title}}</span><span style="font-size: 14px; color: #5B6475">{{e.meta}}</span></span></div></sc-if>
</div>
</sc-for>
<sc-if value="{{noEvents}}" hint-placeholder-val="{{false}}">
<div style="background: transparent; border: 1.5px dashed #CBD2DC; border-radius: 28px; padding: 22px; font-size: 16px; line-height: 1.5; color: #5B6475; text-align: center">Nothing planned. A free day is fine too.</div>
</sc-if>
<p style="margin: 0; padding: 4px 4px 0; font-size: 13px; color: #6B7385">Study sessions are sample content.</p>
</section>

</main>

<nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px; background: linear-gradient(180deg, #FFFFFF, #F0F0F2); box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 1px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.05), 0 16px 34px rgba(0,0,0,.10)">
<a href="Main.dc.html" aria-label="Today" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: transparent; box-shadow: none; border: 1px solid #E8EBF0; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg></a>
<a href="Calendar.dc.html" aria-current="page" class="tabpill" style="flex: 1; height: 56px; border-radius: 999px; color: #111113; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 16px; font-weight: 600; background: linear-gradient(180deg, #DEDEE1, #E9E9EB); box-shadow: inset 0 2px 6px rgba(0,0,0,.13), inset 0 -1px 0 rgba(255,255,255,.9);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg><span class="tablabel">Calendar</span></a>
<a href="Subjects.dc.html" aria-label="Subjects" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: transparent; box-shadow: none; border: 1px solid #E8EBF0; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="7" r="3.5"></circle><circle cx="17" cy="7" r="3.5"></circle><circle cx="7" cy="17" r="3.5"></circle><circle cx="17" cy="17" r="3.5"></circle></svg></a>
<a href="Questions.dc.html" aria-label="Questions" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: transparent; box-shadow: none; border: 1px solid #E8EBF0; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="5"></rect><path d="M8 10h8M8 14h5"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { y: 2026, m: 9, sel: '2026-10-18' };
  }
  renderVals() {
    var self = this;
    var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var TODAY = '2026-10-18';
    function key(d) { var mm = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (mm < 10 ? '0' : '') + mm + '-' + (dd < 10 ? '0' : '') + dd; }
    var EV = {
      '2026-10-18': [{ k: 'study', s: 'SE', title: 'Testing strategies & UML', meta: '10:00 – 11:30 AM' }, { k: 'study', s: 'DAA', title: 'Greedy algorithms', meta: '4:00 – 5:00 PM' }],
      '2026-10-19': [{ k: 'study', s: 'SE', title: 'Process models recap', meta: '9:30 – 11:00 AM' }, { k: 'study', s: 'DAA', title: 'Dynamic programming', meta: '3:00 – 4:30 PM' }],
      '2026-10-20': [{ k: 'study', s: 'SE', title: 'Light review, then rest', meta: '9:00 – 10:00 AM' }, { k: 'study', s: 'DAA', title: 'Graph algorithms', meta: '11:00 AM – 12:30 PM' }],
      '2026-10-21': [{ k: 'exam', s: 'SE', title: 'Software Engineering', meta: 'Exam · you’ve prepared for this' }, { k: 'study', s: 'DAA', title: 'Gentle evening review', meta: '6:00 – 7:00 PM' }],
      '2026-10-22': [{ k: 'exam', s: 'DAA', title: 'Design & Analysis of Algorithm', meta: 'Exam · read each question slowly' }, { k: 'study', s: 'DDS', title: 'Trees & hashing recap', meta: '6:00 – 7:00 PM' }],
      '2026-10-23': [{ k: 'exam', s: 'DDS', title: 'Design of Data Structures', meta: 'Exam · the last one' }]
    };
    var y = this.state.y, m = this.state.m;
    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7;
    var start = new Date(y, m, 1 - offset);
    var last = new Date(y, m + 1, 0);
    var total = Math.ceil((offset + last.getDate()) / 7) * 7;
    var cells = [];
    for (var i = 0; i < total; i++) {
      (function (d) {
        var k = key(d);
        var evs = EV[k] || [];
        var inMonth = d.getMonth() === m;
        var isSel = k === self.state.sel;
        var isToday = !isSel && k === TODAY;
        var exam = evs.filter(function (e) { return e.k === 'exam'; })[0];
        cells.push({
          day: d.getDate(),
          label: DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + (exam ? ', exam' : '') + (evs.length && !exam ? ', ' + evs.length + ' study sessions' : ''),
          pressed: isSel ? 'true' : 'false',
          isSel: isSel, isToday: isToday,
          isPlain: !isSel && !isToday && inMonth,
          isOther: !isSel && !isToday && !inMonth,
          examSE: !!exam && exam.s === 'SE', examDAA: !!exam && exam.s === 'DAA', examDDS: !!exam && exam.s === 'DDS',
          hasStudy: evs.some(function (e) { return e.k === 'study'; }),
          pick: function () { self.setState({ sel: k, y: d.getFullYear(), m: d.getMonth() }); }
        });
      })(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }
    var sp = this.state.sel.split('-');
    var sd = new Date(+sp[0], +sp[1] - 1, +sp[2]);
    var events = (EV[this.state.sel] || []).map(function (e) {
      var ex = e.k === 'exam';
      return { title: e.title, meta: e.meta, isStudy: !ex, examSE: ex && e.s === 'SE', examDAA: ex && e.s === 'DAA', examDDS: ex && e.s === 'DDS', isSE: e.s === 'SE', isDAA: e.s === 'DAA', isDDS: e.s === 'DDS' };
    });
    return {
      cells: cells,
      monthName: MONTHS[m],
      year: y,
      selLabel: (this.state.sel === TODAY ? 'Today, ' : DAYS[sd.getDay()].slice(0, 3) + ', ') + sd.getDate() + ' ' + MONTHS[sd.getMonth()].slice(0, 3),
      events: events,
      noEvents: events.length === 0,
      prev: function () { var mm = self.state.m - 1, yy = self.state.y; if (mm < 0) { mm = 11; yy--; } self.setState({ m: mm, y: yy }); },
      next: function () { var mm = self.state.m + 1, yy = self.state.y; if (mm > 11) { mm = 0; yy++; } self.setState({ m: mm, y: yy }); },
      goToday: function () { self.setState({ y: 2026, m: 9, sel: TODAY }); }
    };
  }
}
</script>
</body>
</html>
