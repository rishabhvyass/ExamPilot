<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — Email code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.pill{transition:width 420ms cubic-bezier(.2,.9,.25,1.08),background-color 280ms ease,box-shadow 280ms ease}
.morph{animation:morph 260ms cubic-bezier(.2,.8,.2,1) both}
.digit{animation:digit 220ms cubic-bezier(.2,.9,.25,1.2) both}
.caret{animation:caret 1s steps(1) infinite}
.spin{animation:spin .8s linear infinite}
.shimmer{background:linear-gradient(90deg,#5B6475 0%,#5B6475 35%,#C6CCD7 50%,#5B6475 65%,#5B6475 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.2s linear infinite}
.shake{animation:shake 420ms cubic-bezier(.36,.07,.19,.97) both}
.shine{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);animation:shine 900ms 250ms ease-in-out both}
.tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 300ms 120ms ease-out forwards}
.cell{transition:background-color 200ms ease,box-shadow 200ms ease,color 200ms ease}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.97)}
.rise{animation:rise 420ms cubic-bezier(.05,.7,.1,1) both}
@keyframes morph{from{opacity:0;filter:blur(6px);transform:scale(.96)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes digit{from{opacity:0;filter:blur(4px);transform:scale(.6) translateY(4px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes shine{from{left:-70px}to{left:110%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
.codeinput{position:absolute;inset:0;opacity:0;font-size:16px;border:0;width:100%;height:100%;cursor:text}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition:none!important}.spin,.shimmer{animation:none!important;color:#5B6475}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">
<main style="padding: 60px 24px 32px; display: flex; flex-direction: column; gap: 18px; height: 100%; box-sizing: border-box">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Login.dc.html" class="press" aria-label="Back" style="width: 52px; height: 52px; border-radius: 999px; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 14px; font-weight: 600; color: #5B6475">Verify email</span>
</div>

<header style="display: flex; flex-direction: column; gap: 8px; padding-top: 18px">
<h1 style="margin: 0; font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em">Check your<br>email</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #5B6475">We sent a 6-digit code to <strong style="font-weight: 600; color: #1B1B1F">you@college.edu</strong>. It works for 10 minutes.</p>
</header>

<div style="height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
<div class="pill {{shakeClass}}" style="position: relative; overflow: hidden; height: 60px; width: {{pillW}}; border-radius: 999px; background: {{pillBg}}; box-shadow: {{pillShadow}}; display: flex; align-items: center; justify-content: center">

<sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
<button type="button" class="morph" onClick="{{start}}" style="position: absolute; inset: 0; border: 0; background: transparent; font: inherit; font-size: 17px; font-weight: 600; color: #1B1B1F; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Enter code</button>
</sc-if>

<sc-if value="{{showCells}}" hint-placeholder-val="{{false}}">
<div class="morph" style="display: flex; gap: 6px; padding: 0 8px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
<sc-if value="{{c.isError}}" hint-placeholder-val="{{false}}"><span class="cell" style="width: 40px; height: 46px; border-radius: 14px; background: #FEE2E2; color: #B91C1C; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600">{{c.d}}</span></sc-if>
<sc-if value="{{c.isFilled}}" hint-placeholder-val="{{false}}"><span class="cell" style="width: 40px; height: 46px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600"><span class="digit">{{c.d}}</span></span></sc-if>
<sc-if value="{{c.isActive}}" hint-placeholder-val="{{true}}"><span class="cell" style="width: 40px; height: 46px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #1B1B1F; display: flex; align-items: center; justify-content: center"><span class="caret" style="width: 2px; height: 20px; border-radius: 2px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); "></span></span></sc-if>
<sc-if value="{{c.isEmpty}}" hint-placeholder-val="{{false}}"><span class="cell" style="width: 40px; height: 46px; border-radius: 14px; background: #EEF0F4"></span></sc-if>
</sc-for>
</div>
<label style="position: absolute; inset: 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">6-digit code</span><input class="codeinput" ref="{{setInput}}" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{digits}}" onChange="{{onType}}"></label>
</sc-if>

<sc-if value="{{isVerifying}}" hint-placeholder-val="{{false}}">
<span class="morph" role="status" style="display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span class="spin" style="width: 16px; height: 16px; border-radius: 999px; border: 2px solid #E2E6EC; border-top-color: #1B1B1F"></span><span class="shimmer">Verifying</span></span>
</sc-if>

<sc-if value="{{isVerified}}" hint-placeholder-val="{{false}}">
<span class="morph" role="status" style="display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; color: #FFFFFF"><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Verified</span>
<span class="shine" aria-hidden="true"></span>
</sc-if>
</div>

<p role="status" style="margin: 0; height: 20px; font-size: 15px; font-weight: 500; color: {{hintColor}}">{{hint}}</p>
</div>

<sc-if value="{{isVerified}}" hint-placeholder-val="{{false}}">
<a class="rise press" href="Profile.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 8px 0 28px; border-radius: 999px; color: #111113; text-decoration: none; font-size: 18px; font-weight: 600; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07);">Continue<span style="width: 46px; height: 46px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</sc-if>
<sc-if value="{{notVerified}}" hint-placeholder-val="{{true}}">
<button type="button" style="align-self: center; height: 44px; padding: 0 14px; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #5B6475; cursor: pointer">Didn’t get it? Resend in 0:30</button>
</sc-if>

<div style="margin-top: auto; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: #6B7385">Prototype demo</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" class="press" onClick="{{demoGood}}" style="height: 48px; border-radius: 999px; border: 0; background: #D9F5E6; color: #065F46; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Correct code</button>
<button type="button" class="press" onClick="{{demoBad}}" style="height: 48px; border-radius: 999px; border: 0; background: #EDE5FF; color: #5B21B6; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Wrong code</button>
</div>
<button type="button" class="press" onClick="{{reset}}" style="height: 44px; border-radius: 999px; border: 1.5px solid #CBD2DC; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #1B1B1F; cursor: pointer">Reset</button>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'idle', digits: '', shake: 0 };
    this.timers = [];
  }
  componentWillUnmount() { this.clear(); }
  clear() { this.timers.forEach(clearTimeout); this.timers = []; }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  focus() { var s = this; this.later(function () { if (s.input) s.input.focus(); }, 60); }
  setDigits(d) {
    var s = this;
    d = (d || '').replace(/\D/g, '').slice(0, 6);
    this.setState({ digits: d, mode: 'entry' });
    if (d.length === 6) {
      this.later(function () { s.setState({ mode: 'verifying' }); }, 260);
      this.later(function () {
        if (d === '123456') s.setState({ mode: 'verified' });
        else { s.setState({ mode: 'error', shake: s.state.shake + 1 }); s.unwind(); }
      }, 1600);
    }
  }
  unwind() {
    var s = this;
    for (var i = 1; i <= 6; i++) (function (k) {
      s.later(function () { s.setState({ digits: s.state.digits.slice(0, -1) }); }, 900 + k * 70);
    })(i);
    this.later(function () { s.setState({ mode: 'entry', digits: '' }); s.focus(); }, 900 + 7 * 70 + 80);
  }
  type(code) {
    var s = this;
    this.clear();
    this.setState({ mode: 'entry', digits: '' });
    code.split('').forEach(function (ch, i) {
      s.later(function () { s.setDigits(s.state.digits + ch); }, 420 + i * 170);
    });
  }
  renderVals() {
    var s = this, m = this.state.mode, d = this.state.digits;
    var cells = [];
    for (var i = 0; i < 6; i++) {
      var ch = d[i] || '';
      cells.push({ d: ch, isError: m === 'error' && !!ch, isFilled: m !== 'error' && !!ch, isActive: m === 'entry' && !ch && i === d.length, isEmpty: !ch && !(m === 'entry' && i === d.length) });
    }
    var W = { idle: '168px', entry: '300px', error: '300px', verifying: '160px', verified: '156px' };
    return {
      isIdle: m === 'idle', showCells: m === 'entry' || m === 'error', isVerifying: m === 'verifying', isVerified: m === 'verified', notVerified: m !== 'verified',
      cells: cells, digits: d,
      pillW: W[m],
      pillBg: m === 'verified' ? '#047857' : '#FFFFFF',
      pillShadow: m === 'verified' ? '0 10px 26px rgba(4,120,87,.30)' : '0 1px 2px rgba(15,23,42,.06), 0 10px 26px rgba(15,23,42,.10)',
      shakeClass: m === 'error' ? 'shake' : '',
      hint: m === 'error' ? 'That code didn’t match. Try again.' : m === 'verified' ? 'Email verified. Nice!' : m === 'verifying' ? '' : m === 'entry' ? 'Type the code from your email' : '',
      hintColor: m === 'error' ? '#B91C1C' : m === 'verified' ? '#065F46' : '#5B6475',
      setInput: function (el) { s.input = el; },
      start: function () { s.setState({ mode: 'entry', digits: '' }); s.focus(); },
      onType: function (e) { s.clear(); s.setDigits(e.target.value); },
      demoGood: function () { s.type('123456'); },
      demoBad: function () { s.type('213212'); },
      reset: function () { s.clear(); s.setState({ mode: 'idle', digits: '' }); }
    };
  }
}
</script>
</body>
</html>
