<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — Blur reader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.track{transition:transform 900ms cubic-bezier(.65,0,.25,1)}
.para{transition:color 700ms ease,filter 700ms ease,opacity 700ms ease,font-weight 700ms ease}
.mode.m0{animation:modeA 520ms cubic-bezier(.2,.8,.2,1) both}
.mode.m1{animation:modeB 520ms cubic-bezier(.2,.8,.2,1) both}
.seg{transition:left 420ms cubic-bezier(.3,1.25,.45,1)}
.ib{transition:transform 180ms cubic-bezier(.2,0,0,1),filter 220ms ease}
.ib:hover{transform:translateY(-1px)}
.ib:active{transform:scale(.92);filter:blur(.6px)}
.ib svg{transition:transform 380ms cubic-bezier(.3,1.5,.45,1)}
.ib.on svg{transform:scale(1.08)}
.rnd{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease}
.rnd:active{transform:scale(.92)}
.pen{transition:transform 420ms cubic-bezier(.3,1.5,.45,1)}
.rnd.on .pen{transform:rotate(-18deg) scale(1.1)}
.hl{background:linear-gradient(transparent 60%,rgba(0,0,0,.08) 60%) left/0% 100% no-repeat;transition:background-size 700ms cubic-bezier(.6,0,.3,1)}
.hl.on{background-size:100% 100%}
@keyframes modeA{from{opacity:0;filter:blur(14px);transform:scale(.98)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes modeB{from{opacity:0;filter:blur(14px);transform:scale(.98)}to{opacity:1;filter:blur(0);transform:none}}
button:focus-visible{outline:3px solid #111113;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.track,.para,.seg,.ib,.ib svg,.rnd,.pen,.hl{transition:none}.mode.m0,.mode.m1{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #111113">

<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><linearGradient id="gloss" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#8A8A90"></stop><stop offset=".45" stop-color="#2A2A2E"></stop><stop offset="1" stop-color="#050506"></stop></linearGradient><linearGradient id="glossSoft" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#C4C4C9"></stop><stop offset=".5" stop-color="#6A6A70"></stop><stop offset="1" stop-color="#2A2A2E"></stop></linearGradient></defs></svg>

<header style="position: absolute; left: 24px; right: 24px; top: 62px">
<span style="font-size: 14px; font-weight: 600; color: #8A8A90">SE · Unit 3 · sample notes</span>
<h1 style="margin: 4px 0 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em">Focus read</h1>
</header>

<section style="position: absolute; left: 20px; right: 20px; top: 150px; height: 600px; border-radius: 40px; background: linear-gradient(180deg, #FFFFFF, #F7F7F8); box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 1px rgba(0,0,0,.045), 0 2px 6px rgba(0,0,0,.04), 0 24px 50px rgba(0,0,0,.08); overflow: hidden">

<sc-for list="{{modeKey}}" as="mk" hint-placeholder-count="1">
<div class="mode {{mk.cls}}" style="position: absolute; left: 0; right: 0; top: 0; bottom: 96px; overflow: hidden">
<div class="track" ref="{{trackRef}}" style="position: absolute; left: 26px; right: 26px; top: 0">
<sc-for list="{{paras}}" as="p" hint-placeholder-count="6">
<p class="para" style="margin: 0 0 22px; font-size: 17px; line-height: 1.5; font-weight: {{p.w}}; color: {{p.c}}; filter: blur({{p.b}}); opacity: {{p.o}}"><span class="hl {{p.hl}}">{{p.t}}</span></p>
</sc-for>
</div>
</div>
</sc-for>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 120px; pointer-events: none">
<span style="position: absolute; inset: 0; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); -webkit-mask: linear-gradient(180deg, #000 60%, transparent); mask: linear-gradient(180deg, #000 60%, transparent)"></span>
<span style="position: absolute; inset: 0 0 30px 0; -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); -webkit-mask: linear-gradient(180deg, #000 45%, transparent); mask: linear-gradient(180deg, #000 45%, transparent)"></span>
<span style="position: absolute; inset: 0 0 60px 0; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); -webkit-mask: linear-gradient(180deg, #000 30%, transparent); mask: linear-gradient(180deg, #000 30%, transparent)"></span>
<span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0))"></span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 96px; height: 110px; pointer-events: none">
<span style="position: absolute; inset: 0; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); -webkit-mask: linear-gradient(0deg, #000 60%, transparent); mask: linear-gradient(0deg, #000 60%, transparent)"></span>
<span style="position: absolute; inset: 30px 0 0 0; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); -webkit-mask: linear-gradient(0deg, #000 40%, transparent); mask: linear-gradient(0deg, #000 40%, transparent)"></span>
<span style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(247,247,248,.95), rgba(247,247,248,0))"></span>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 64px; display: flex; align-items: center; justify-content: space-between">
<div role="tablist" aria-label="Reader mode" style="position: relative; height: 60px; padding: 5px; box-sizing: border-box; border-radius: 999px; background: linear-gradient(180deg, #FFFFFF, #F0F0F2); box-shadow: inset 0 1px 0 #FFFFFF, 0 0 0 1px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.05), 0 12px 26px rgba(0,0,0,.09); display: flex; gap: 2px">
<span class="seg" aria-hidden="true" style="position: absolute; top: 5px; left: {{segL}}; width: 64px; height: 50px; border-radius: 999px; background: linear-gradient(180deg, #DEDEE1, #E9E9EB); box-shadow: inset 0 2px 6px rgba(0,0,0,.13), inset 0 -1px 0 rgba(255,255,255,.9)"></span>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.on}}" aria-label="{{t.label}}" onClick="{{t.pick}}" class="ib {{t.cls}}" style="position: relative; width: 64px; height: 50px; border: 0; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}" fill="{{t.fill}}"></path></svg></button>
</sc-for>
</div>
<button type="button" onClick="{{toggleHl}}" aria-pressed="{{hlOn}}" aria-label="Highlight focus line" class="rnd {{hlCls}}" style="width: 60px; height: 60px; border: 0; border-radius: 999px; background: {{rndBg}}; box-shadow: {{rndSh}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg class="pen" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3c-6 0-11 4-13 10l-2 6 1.2 1.2 6-2C18 16 21 10 21 4zM7.5 16.5L15 9" fill="none" stroke="url(#gloss)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</section>

<p style="position: absolute; left: 24px; right: 24px; bottom: 40px; margin: 0; text-align: center; font-size: 13px; color: #8A8A90">{{hint}}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, mode: 0, flip: 0, hl: false, paused: false }; }
  componentDidMount() { var s = this; this.t = setInterval(function () { if (!s.state.paused) s.setState({ i: (s.state.i + 1) % s.list().length }); }, 2600); }
  componentWillUnmount() { clearInterval(this.t); }
  componentDidUpdate() { this.place(); }
  place() {
    var el = this.track; if (!el) return;
    var kids = el.children, i = this.state.i % this.list().length, c = kids[i];
    if (!c) return;
    el.style.transform = 'translateY(' + Math.round(252 - (c.offsetTop + c.offsetHeight / 2)) + 'px)';
  }
  list() {
    var M = [
      ['Testing shows that bugs are present. It can never prove that they are absent.', 'The aim is to find defects early, while they are still cheap to fix.', 'Verification asks: are we building the product right?', 'Validation asks: are we building the right product?', 'Black-box tests look only at inputs and outputs, never the code.', 'White-box tests are designed from the code’s own structure.', 'Boundary values sit at the edges, where most mistakes hide.', 'Regression tests re-run old checks after every change.'],
      ['You asked: what is the difference between verification and validation?', 'Pilo: verification checks the work against the spec.', 'Validation checks the product against what users really need.', 'An easy way to remember it: right product versus product right.', 'Want a five-question quiz on this unit?'],
      ['Saved · Boundary value analysis — test min, min+1, max−1, max.', 'Saved · Cyclomatic complexity = E − N + 2P.', 'Saved · Unit → integration → system → acceptance.', 'Saved · Alpha testing happens in-house; beta with real users.']
    ];
    return M[this.state.mode];
  }
  renderVals() {
    var s = this, st = this.state, L = this.list(), i = st.i % L.length;
    var D = [
      'M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z',
      'M4 4h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H10l-5 4v-4H4a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zM20 9a3 3 0 0 1 3 3v5a2 2 0 0 1-2 2v3l-3-3h-4',
      'M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z'
    ];
    var labels = ['Notes', 'Ask Pilo', 'Saved'];
    return {
      modeKey: [{ cls: 'm' + (st.flip % 2) }],
      trackRef: function (el) { s.track = el; s.place(); },
      paras: L.map(function (t, k) {
        var d = Math.abs(k - i);
        return { t: t, w: d === 0 ? 700 : 500, c: d === 0 ? '#111113' : (d === 1 ? '#6E6E74' : '#A6A6AC'), b: d === 0 ? '0px' : (d === 1 ? '0.4px' : '1.6px'), o: d > 3 ? 0 : 1, hl: d === 0 && st.hl ? 'on' : '' };
      }),
      segL: (5 + st.mode * 66) + 'px',
      tabs: labels.map(function (l, k) { var on = k === st.mode; return { label: l, d: D[k], on: on ? 'true' : 'false', cls: on ? 'on' : '', fill: on ? 'url(#gloss)' : 'url(#glossSoft)', pick: function () { if (k !== s.state.mode) s.setState({ mode: k, i: 0, flip: s.state.flip + 1 }); } }; }),
      hlOn: st.hl ? 'true' : 'false', hlCls: st.hl ? 'on' : '',
      rndBg: st.hl ? 'linear-gradient(180deg, #DEDEE1, #E9E9EB)' : 'linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%)',
      rndSh: st.hl ? 'inset 0 2px 6px rgba(0,0,0,.13), inset 0 -1px 0 rgba(255,255,255,.9)' : 'inset 0 1px 0 #FFFFFF, 0 0 0 1px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.05), 0 12px 26px rgba(0,0,0,.09)',
      toggleHl: function () { s.setState({ hl: !s.state.hl }); },
      hint: 'Lines drift in and out of focus · tap a mode to blur-switch'
    };
  }
}
</script>
</body>
</html>
