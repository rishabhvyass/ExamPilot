<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — App icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.bob{animation:bob 3s ease-in-out infinite}
.drift{animation:drift 7s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){.bob,.drift,.eyes{animation:none}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}
</style>
</helmet>
<div style="width: 620px; height: 560px; box-sizing: border-box; padding: 44px; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; display: flex; gap: 36px">

<div style="display: flex; flex-direction: column; gap: 22px">
<div role="img" aria-label="ExamPilot app icon: Pilo the cloud buddy smiling on a blue sky with soft clouds" style="position: relative; width: 300px; height: 300px; border-radius: 84px; overflow: hidden; background: linear-gradient(160deg, #4C93F3 0%, #3B78E7 50%, #7DBDF8 100%); box-shadow: 0 30px 60px rgba(59,120,231,.30), inset 0 0 0 6px rgba(255,255,255,.45), inset 0 -18px 30px rgba(20,60,160,.15)">
<span class="drift" style="position: absolute; left: -40px; bottom: -26px; width: 190px; height: 110px; border-radius: 999px; background: #FFFFFF; filter: blur(16px); opacity: .85"></span>
<span class="drift" style="position: absolute; left: 30px; bottom: -40px; width: 140px; height: 90px; border-radius: 999px; background: #F2F8FF; filter: blur(14px); opacity: .8; animation-delay: -2s"></span>
<span class="drift" style="position: absolute; right: -40px; top: -24px; width: 180px; height: 120px; border-radius: 999px; background: #E6F2FF; filter: blur(18px); opacity: .9; animation-delay: -4s"></span>
<span style="position: absolute; left: 0; right: 0; top: 0; height: 40%; background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0))"></span>
<span class="bob" style="position: absolute; left: 42px; top: 58px; width: 216px; height: 180px">
<svg width="216" height="180" viewBox="0 0 120 100" aria-hidden="true">
<path d="M30 86C14 86 4 75 4 61c0-12 9-21 21-22 2-16 16-29 33-29 14 0 26 8 31 21h5c13 0 23 11 23 25 0 15-11 30-25 30z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"></path>
<path d="M30 86C14 86 4 75 4 61c0-12 9-21 21-22 2-16 16-29 33-29 14 0 26 8 31 21h5c13 0 23 11 23 25 0 15-11 30-25 30z" fill="#E4F0FF" stroke="#3E7BE0" stroke-width="5" stroke-linejoin="round"></path>
<path d="M22 50c3-6 8-9 14-10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".9"></path>
<g class="eyes"><rect x="49" y="40" width="8" height="14" rx="4" fill="#2D5FB8"></rect><rect x="66" y="40" width="8" height="14" rx="4" fill="#2D5FB8"></rect></g>
<path d="M48 61q13 11 26 0" fill="none" stroke="#2D5FB8" stroke-width="4.5" stroke-linecap="round"></path>
<circle cx="40" cy="60" r="5" fill="#F9A8D4" opacity=".9"></circle><circle cx="82" cy="60" r="5" fill="#F9A8D4" opacity=".9"></circle>
</svg>
</span>
</div>
<div style="display: flex; align-items: flex-end; gap: 18px">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="position: relative; width: {{z.px}}; height: {{z.px}}; border-radius: {{z.r}}; overflow: hidden; background: linear-gradient(160deg, #4C93F3 0%, #3B78E7 50%, #7DBDF8 100%); box-shadow: 0 8px 18px rgba(59,120,231,.25), inset 0 0 0 2px rgba(255,255,255,.45)">
<span style="position: absolute; left: -12%; bottom: -8%; width: 60%; height: 36%; border-radius: 999px; background: #FFFFFF; filter: blur(6px); opacity: .85"></span>
<svg style="position: absolute; left: 14%; top: 19%" width="{{z.m}}" height="{{z.m}}" viewBox="0 0 120 100" aria-hidden="true"><path d="M30 86C14 86 4 75 4 61c0-12 9-21 21-22 2-16 16-29 33-29 14 0 26 8 31 21h5c13 0 23 11 23 25 0 15-11 30-25 30z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"></path><path d="M30 86C14 86 4 75 4 61c0-12 9-21 21-22 2-16 16-29 33-29 14 0 26 8 31 21h5c13 0 23 11 23 25 0 15-11 30-25 30z" fill="#E4F0FF" stroke="#3E7BE0" stroke-width="6" stroke-linejoin="round"></path><rect x="49" y="40" width="8" height="14" rx="4" fill="#2D5FB8"></rect><rect x="66" y="40" width="8" height="14" rx="4" fill="#2D5FB8"></rect><path d="M48 61q13 11 26 0" fill="none" stroke="#2D5FB8" stroke-width="5" stroke-linecap="round"></path></svg>
</span>
<span style="font-size: 12px; color: #6B7385">{{z.label}}</span>
</div>
</sc-for>
</div>
</div>

<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding-top: 6px">
<span style="font-size: 14px; font-weight: 600; color: #3B78E7">APP ICON</span>
<h1 style="margin: 0; font-size: 34px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em">Meet Pilo, your study buddy</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #5B6475">A soft cloud with a calm smile on a bright sky. Glossy rim, drifting clouds and a sticker outline, so it reads at every size.</p>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 18px; height: 18px; border-radius: 6px; background: #4C93F3"></span>Sky #4C93F3 → #3B78E7 → #7DBDF8</span>
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 18px; height: 18px; border-radius: 6px; background: #3E7BE0"></span>Outline #3E7BE0 · eyes #2D5FB8</span>
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 18px; height: 18px; border-radius: 6px; background: #F9A8D4"></span>Cheeks #F9A8D4</span>
</div>
<div style="margin-top: auto; border-radius: 24px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%);  padding: 18px; display: flex; gap: 18px; justify-content: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 60px; height: 60px; border-radius: 16px; background: #34343C"></span><span style="font-size: 11px; color: #B8BFCC">Notes</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="position: relative; width: 60px; height: 60px; border-radius: 16px; overflow: hidden; background: linear-gradient(160deg, #4C93F3 0%, #3B78E7 50%, #7DBDF8 100%)"><svg style="position: absolute; left: 9px; top: 12px" width="42" height="35" viewBox="0 0 120 100" aria-hidden="true"><path d="M30 86C14 86 4 75 4 61c0-12 9-21 21-22 2-16 16-29 33-29 14 0 26 8 31 21h5c13 0 23 11 23 25 0 15-11 30-25 30z" fill="#E4F0FF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"></path><rect x="49" y="40" width="8" height="14" rx="4" fill="#2D5FB8"></rect><rect x="66" y="40" width="8" height="14" rx="4" fill="#2D5FB8"></rect></svg></span><span style="font-size: 11px; color: #FFFFFF; font-weight: 600">ExamPilot</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 60px; height: 60px; border-radius: 16px; background: #34343C"></span><span style="font-size: 11px; color: #B8BFCC">Calendar</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":620,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sizes: [
        { px: '120px', r: '34px', m: '86', label: '120' },
        { px: '76px', r: '22px', m: '54', label: '76' },
        { px: '48px', r: '14px', m: '34', label: '48' }
      ]
    };
  }
}
</script>
</body>
</html>
