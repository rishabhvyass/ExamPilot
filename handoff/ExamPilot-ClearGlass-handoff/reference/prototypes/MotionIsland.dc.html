<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.geo{position:absolute;transition:left 560ms cubic-bezier(.3,1.25,.45,1),top 560ms cubic-bezier(.3,1.25,.45,1),width 560ms cubic-bezier(.3,1.25,.45,1),height 560ms cubic-bezier(.3,1.25,.45,1),border-radius 560ms ease,opacity 300ms ease,box-shadow 400ms ease}
.fadein{animation:fadein 360ms 140ms cubic-bezier(.2,.8,.2,1) both}
.pop{animation:pop 380ms 180ms cubic-bezier(.2,.9,.25,1.3) both}
.ring{animation:spin 1s linear infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.blink{animation:blink 2.6s ease-in-out infinite}
.tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 320ms 200ms ease-out forwards}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1),background-color 160ms ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.96)}
@keyframes fadein{from{opacity:0;filter:blur(6px);transform:translateX(-6px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes draw{to{stroke-dashoffset:0}}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.geo{transition:opacity 200ms ease!important}.fadein,.pop,.ring,.pulse,.blink{animation:none!important}.tick path{stroke-dashoffset:0}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">

</span>
<div class="geo" style="left: {{p.x}}; top: {{p.y}}; width: {{p.w}}; height: {{p.h}}; display: flex; align-items: center; color: #FFFFFF; overflow: hidden">
<sc-if value="{{s.alert}}" hint-placeholder-val="{{false}}"><div class="fadein" style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 66px; min-width: 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; font-weight: 600; white-space: nowrap">SE exam · Wed 2 PM</span><span style="font-size: 13px; color: #B8BFCC; white-space: nowrap">3 days to prepare</span></span><span class="pop pulse" style="flex: none; width: 42px; height: 42px; border-radius: 999px; background: #3B82F6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg></span></div></sc-if>
<sc-if value="{{s.next}}" hint-placeholder-val="{{false}}"><div class="fadein" style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 66px; min-width: 0"><span style="flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><strong style="font-weight: 600">Next up</strong> <span style="color: #B8BFCC">Master theorem · 25 min</span></span><button type="button" class="pop press" onClick="{{toWorking}}" aria-label="Start" style="flex: none; width: 42px; height: 42px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141417" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></div></sc-if>
<sc-if value="{{s.working}}" hint-placeholder-val="{{false}}"><div class="fadein" style="flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 6px"><span style="font-size: 14px; color: #B8BFCC; margin-right: auto; padding-left: 58px">Updating your plan</span><span class="ring" style="width: 34px; height: 34px; border-radius: 999px; border: 3px solid rgba(124,151,255,.25); border-top-color: #7C97FF; box-sizing: border-box"></span><span style="width: 40px; height: 40px; border-radius: 999px; background: #1E3A8A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#7C97FF" aria-hidden="true"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"></path></svg></span></div></sc-if>
<sc-if value="{{s.checked}}" hint-placeholder-val="{{false}}"><div class="fadein" style="flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 6px"><span style="font-size: 14px; color: #B8BFCC; margin-right: auto; padding-left: 58px">Plan updated</span><span class="pop" style="width: 34px; height: 34px; border-radius: 999px; border: 2.5px solid #7C97FF; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C97FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span><span style="width: 40px; height: 40px; border-radius: 999px; background: #1E3A8A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#7C97FF" aria-hidden="true"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"></path></svg></span></div></sc-if>
<sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><div class="fadein" style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 66px; min-width: 0"><span style="flex: 1; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Moved DAA practice to 4 PM</span><span class="pop" style="flex: none; width: 42px; height: 42px; border-radius: 999px; background: #059669; display: flex; align-items: center; justify-content: center"><svg class="tick" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span></div></sc-if>
<sc-if value="{{s.allDone}}" hint-placeholder-val="{{false}}"><div class="fadein" style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 66px"><span style="display: flex"><span style="width: 22px; height: 22px; border-radius: 999px; background: #DCEBFF; border: 2px solid #141417"></span><span style="width: 22px; height: 22px; border-radius: 999px; background: #EDE5FF; border: 2px solid #141417; margin-left: -8px"></span><span style="width: 22px; height: 22px; border-radius: 999px; background: #D9F5E6; border: 2px solid #141417; margin-left: -8px"></span></span><span style="flex: 1; font-size: 15px; font-weight: 600; white-space: nowrap">All done for today!</span><span class="pop" style="flex: none; width: 42px; height: 42px; border-radius: 999px; background: #059669; display: flex; align-items: center; justify-content: center"><svg class="tick" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span></div></sc-if>
</div>
</div>

<main style="padding: 126px 20px 0; display: flex; flex-direction: column; gap: 14px; opacity: 0.55" aria-hidden="true">
<span style="font-size: 20px; font-weight: 500; color: #5B6475">Good morning</span>
<span style="font-weight: 600; font-size: 46px; line-height: 1.02; letter-spacing: -0.03em">Your Exam<br>Week</span>
<div style="height: 250px; border-radius: 34px; background: linear-gradient(160deg, rgba(255,255,255,.6), rgba(255,255,255,0) 55%), #DCEBFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.6), 0 12px 30px rgba(15,23,42,.06);"></div>
<div style="height: 68px; border-radius: 999px; background: #EDE5FF"></div>
<div style="height: 68px; border-radius: 999px; background: #D9F5E6"></div>
</main>

<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); border-radius: 30px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 32px rgba(15,23,42,.12)">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">Study island states</span>
<button type="button" class="press" onClick="{{toggleAuto}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{autoLabel}}</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{steps}}" as="t" hint-placeholder-count="8">
<sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><button type="button" class="press" onClick="{{t.go}}" aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #DCEBFF; color: #1E3A8A; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{t.label}}</button></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{true}}"><button type="button" class="press" onClick="{{t.go}}" aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E8EBF0; background: transparent; color: #1B1B1F; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{t.label}}</button></sc-if>
</sc-for>
</div>
<span style="font-size: 13px; line-height: 1.45; color: #6B7385">Sits at the top of Today. Splits from the mascot, stretches for news, and merges back when quiet.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, auto: true };
    this.SEQ = [
      { k: 'merged', label: 'Rest', ms: 900 },
      { k: 'split', label: 'Split', ms: 700 },
      { k: 'apart', label: 'Apart', ms: 900 },
      { k: 'alert', label: 'Exam alert', ms: 2200 },
      { k: 'next', label: 'Next up', ms: 2000 },
      { k: 'working', label: 'AI working', ms: 1700 },
      { k: 'checked', label: 'Checked', ms: 1100 },
      { k: 'done', label: 'Done', ms: 1900 },
      { k: 'allDone', label: 'All done', ms: 2000 },
      { k: 'apart', label: 'Apart', ms: 800, hidden: true },
      { k: 'merged', label: 'Merge', ms: 1200, hidden: true }
    ];
  }
  componentDidMount() { this.tick(); }
  componentWillUnmount() { clearTimeout(this.t); }
  tick() {
    var s = this;
    clearTimeout(this.t);
    if (!this.state.auto) return;
    this.t = setTimeout(function () {
      if (!s.state.auto) return;
      s.setState({ i: (s.state.i + 1) % s.SEQ.length });
      s.tick();
    }, this.SEQ[this.state.i].ms);
  }
  renderVals() {
    var s = this;
    var k = this.SEQ[this.state.i].k;
    var G = {
      merged:  { c: [131, 18, 48], p: [131, 18, 128, 48] },
      split:   { c: [104, 18, 48], p: [150, 18, 136, 48] },
      apart:   { c: [92, 18, 48],  p: [158, 18, 140, 48] },
      alert:   { c: [32, 18, 50],  p: [24, 13, 342, 60] },
      next:    { c: [32, 18, 50],  p: [24, 13, 342, 60] },
      working: { c: [66, 20, 44],  p: [58, 16, 274, 52] },
      checked: { c: [66, 20, 44],  p: [58, 16, 274, 52] },
      done:    { c: [32, 18, 50],  p: [24, 13, 342, 60] },
      allDone: { c: [32, 18, 50],  p: [24, 13, 342, 60] }
    }[k];
    var px = function (n) { return n + 'px'; };
    var glow = {
      alert: '0 0 0 3px #3B82F6, 0 0 28px 6px rgba(59,130,246,.55)',
      working: '0 0 0 3px rgba(124,151,255,.7), 0 0 26px 6px rgba(124,151,255,.45)',
      checked: '0 0 0 3px rgba(124,151,255,.9), 0 0 26px 6px rgba(124,151,255,.45)',
      done: '0 0 0 3px #059669, 0 0 22px 4px rgba(5,150,105,.4)',
      allDone: '0 0 0 3px #059669, 0 0 22px 4px rgba(5,150,105,.4)'
    }[k] || '0 0 0 0 rgba(0,0,0,0)';
    var labels = { alert: 'Software Engineering exam Wednesday 2 PM, 3 days to prepare', next: 'Next up: Master theorem, 25 minutes', working: 'Study buddy is updating your plan', checked: 'Plan updated', done: 'Moved DAA practice to 4 PM', allDone: 'All done for today' };
    var seen = {};
    return {
      c: { x: px(G.c[0]), y: px(G.c[1]), s: px(G.c[2]) },
      p: { x: px(G.p[0]), y: px(G.p[1]), w: px(G.p[2]), h: px(G.p[3]) },
      glow: glow,
      mascotSize: G.c[2] >= 50 ? '38' : '34',
      mascotOpacity: '1',
      label: labels[k] || 'Study island',
      s: { alert: k === 'alert', next: k === 'next', working: k === 'working', checked: k === 'checked', done: k === 'done', allDone: k === 'allDone' },
      autoLabel: this.state.auto ? 'Pause' : 'Play',
      toggleAuto: function () { var a = !s.state.auto; s.setState({ auto: a }); if (a) setTimeout(function () { s.tick(); }, 0); else clearTimeout(s.t); },
      toWorking: function () { clearTimeout(s.t); s.setState({ i: 5, auto: false }); },
      steps: this.SEQ.map(function (st, idx) { return { st: st, idx: idx }; }).filter(function (o) { return !o.st.hidden; }).map(function (o) {
        return { label: o.st.label, on: o.idx === s.state.i, off: o.idx !== s.state.i, go: function () { clearTimeout(s.t); s.setState({ i: o.idx, auto: false }); } };
      })
    };
  }
}
</script>
