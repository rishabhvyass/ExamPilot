<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — Admit card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1B1B1F}a:hover{color:#000000}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1),background-color 160ms ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.97)}
.zone{transition:transform 200ms ease,box-shadow 200ms ease}
.zone:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.10)}
.fadeup{animation:fadeup 420ms cubic-bezier(.05,.7,.1,1) both}
.s1{animation-delay:80ms}.s2{animation-delay:200ms}.s3{animation-delay:320ms}
.bob{animation:bob 2.4s ease-in-out infinite}
.scan{animation:scan 1.6s cubic-bezier(.45,0,.55,1) infinite alternate}
.dot{animation:dot 1.2s ease-in-out infinite}
.dot2{animation-delay:.15s}.dot3{animation-delay:.3s}
.shine{animation:shine 1.4s ease-in-out infinite}
.grow{transform-origin:left;animation:grow 600ms 200ms cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scan{from{top:8%}to{top:88%}}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes shine{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #1B1B1F;outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.scan{top:48%}}

@keyframes fadeup{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes pagein{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(22px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.press{transition:transform 180ms cubic-bezier(.2,0,0,1),box-shadow 220ms ease,filter 220ms ease,background 220ms ease!important}
.press:active{transform:scale(.96)!important;filter:blur(.6px)}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">
<main style="padding: 60px 24px 32px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 14px">
<a href="Profile.dc.html" class="press" aria-label="Back" style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
<span style="height: 6px; border-radius: 999px; background: #151517; "></span>
<span class="grow" style="height: 6px; border-radius: 999px; background: #151517; "></span>
<span style="height: 6px; border-radius: 999px; background: #E2E6EC"></span>
</div>
<span style="font-size: 14px; font-weight: 600; color: #5B6475">2 of 3</span>
</div>

<header style="display: flex; flex-direction: column; gap: 8px; padding-top: 6px">
<h1 style="margin: 0; font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em">{{title}}</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #5B6475">{{subtitle}}</p>
</header>

<sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
<div class="fadeup" style="display: flex; flex-direction: column; gap: 12px">
<label class="zone" style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 34px 20px 28px; border-radius: 34px; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); border: 2px dashed #CBD2DC; text-align: center">
<input class="vh" type="file" accept=".pdf,image/*" onChange="{{start}}">
<span class="bob" aria-hidden="true" style="width: 84px; height: 84px; border-radius: 999px; background: #DCEBFF; color: #1E3A8A; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></span>
<span style="font-size: 20px; font-weight: 600">Upload admit card</span>
<span style="font-size: 15px; line-height: 1.5; color: #5B6475">PDF or a clear photo · up to 10 MB</span>
<span style="margin-top: 4px; height: 50px; padding: 0 24px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18); color: #FFFFFF; display: flex; align-items: center; font-size: 16px; font-weight: 600">Choose file</span>
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label class="press" style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 999px; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); font-size: 16px; font-weight: 600">
<input class="vh" type="file" accept="image/*" capture="environment" onChange="{{start}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Take photo</label>
<button type="button" class="press" onClick="{{start}}" style="height: 56px; border-radius: 999px; border: 1.5px solid #CBD2DC; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #1B1B1F; cursor: pointer">Try a sample</button>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(160deg, rgba(255,255,255,.6), rgba(255,255,255,0) 55%), #D9F5E6; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.6), 0 12px 30px rgba(15,23,42,.06); border-radius: 24px; padding: 14px 16px; font-size: 15px; line-height: 1.5; color: #065F46">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span>We only read subjects, dates and times. You confirm everything, and you can delete the file anytime.</span>
</div>
</div>
</sc-if>

<sc-if value="{{isScanning}}" hint-placeholder-val="{{false}}">
<div class="fadeup" style="display: flex; flex-direction: column; align-items: center; gap: 22px; padding-top: 10px">
<div aria-hidden="true" style="position: relative; width: 250px; height: 320px; border-radius: 26px; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: 0 18px 40px rgba(15,23,42,.12); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div style="display: flex; gap: 12px; align-items: center"><span style="width: 46px; height: 56px; border-radius: 10px; background: #EEF0F4"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 7px"><span class="shine" style="height: 9px; width: 80%; border-radius: 999px; background: #E2E6EC"></span><span class="shine" style="height: 9px; width: 55%; border-radius: 999px; background: #E8EBF0"></span></span></div>
<span style="height: 1px; background: #EEF0F4"></span>
<span class="shine" style="height: 30px; border-radius: 10px; background: #DCEBFF"></span>
<span class="shine" style="height: 30px; border-radius: 10px; background: #EDE5FF"></span>
<span class="shine" style="height: 30px; border-radius: 10px; background: #D9F5E6"></span>
<span class="shine" style="height: 9px; width: 70%; border-radius: 999px; background: #E8EBF0"></span>
<span class="shine" style="height: 9px; width: 45%; border-radius: 999px; background: #E8EBF0"></span>
<span class="scan" style="position: absolute; left: 0; right: 0; top: 8%; height: 3px; background: #151517;  box-shadow: 0 0 18px 6px rgba(59,130,246,.55)"></span>
</div>
<p role="status" style="margin: 0; font-size: 18px; font-weight: 600; display: flex; gap: 2px">Reading your exam dates<span class="dot">.</span><span class="dot dot2">.</span><span class="dot dot3">.</span></p>
</div>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{exams}}" as="x" hint-placeholder-count="3">
<div class="fadeup" style="animation-delay: {{x.delay}}">
<sc-if value="{{x.isSE}}" hint-placeholder-val="{{true}}"><div style="display: flex; align-items: center; gap: 14px; background: linear-gradient(160deg, rgba(255,255,255,.6), rgba(255,255,255,0) 55%), #DCEBFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.6), 0 12px 30px rgba(15,23,42,.06); border-radius: 30px; padding: 10px 10px 10px 10px"><span style="flex: none; width: 56px; height: 56px; border-radius: 20px; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1"><span style="font-size: 20px; font-weight: 700">{{x.day}}</span><span style="font-size: 12px; font-weight: 600; color: #1E40AF">OCT</span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{x.name}}</span><span style="font-size: 14px; color: #1E40AF">{{x.meta}}</span></span><button type="button" class="press" aria-label="Edit exam" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button></div></sc-if>
<sc-if value="{{x.isDAA}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 14px; background: linear-gradient(160deg, rgba(255,255,255,.6), rgba(255,255,255,0) 55%), #EDE5FF; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.6), 0 12px 30px rgba(15,23,42,.06); border-radius: 30px; padding: 10px"><span style="flex: none; width: 56px; height: 56px; border-radius: 20px; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1"><span style="font-size: 20px; font-weight: 700">{{x.day}}</span><span style="font-size: 12px; font-weight: 600; color: #5B21B6">OCT</span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{x.name}}</span><span style="font-size: 14px; color: #5B21B6">{{x.meta}}</span></span><button type="button" class="press" aria-label="Edit exam" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button></div></sc-if>
<sc-if value="{{x.isDDS}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 14px; background: linear-gradient(160deg, rgba(255,255,255,.6), rgba(255,255,255,0) 55%), #D9F5E6; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.6), 0 12px 30px rgba(15,23,42,.06); border-radius: 30px; padding: 10px"><span style="flex: none; width: 56px; height: 56px; border-radius: 20px; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(248,250,253,.55)); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 0 0 1px rgba(15,23,42,.07), 0 14px 36px rgba(15,23,42,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1"><span style="font-size: 20px; font-weight: 700">{{x.day}}</span><span style="font-size: 12px; font-weight: 600; color: #065F46">OCT</span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{x.name}}</span><span style="font-size: 14px; color: #065F46">{{x.meta}}</span></span><button type="button" class="press" aria-label="Edit exam" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button></div></sc-if>
</div>
</sc-for>
<button type="button" class="press fadeup s3" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; border: 1.5px dashed #CBD2DC; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #1B1B1F; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add an exam we missed</button>
<a class="press fadeup s3" href="PlanReady.dc.html" style="margin-top: 6px; display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 8px 0 28px; border-radius: 999px; color: #111113; text-decoration: none; font-size: 18px; font-weight: 600; background: linear-gradient(180deg, #FFFFFF 0%, #F1F1F2 60%, #E9E9EB 100%); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 5px rgba(0,0,0,.035), 0 0 0 1px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07);">Looks right — build my plan<span style="width: 46px; height: 46px; border-radius: 999px; background: linear-gradient(180deg, #4A4A4F 0%, #1C1C1F 55%, #0E0E10 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.18);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
<button type="button" onClick="{{reset}}" style="align-self: center; height: 44px; padding: 0 14px; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #5B6475; cursor: pointer; text-decoration: underline">Upload a different file</button>
</div>
</sc-if>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 'idle' };
  }
  componentWillUnmount() { if (this.t) clearTimeout(this.t); }
  renderVals() {
    var self = this;
    var st = this.state.stage;
    var titles = {
      idle: ['Add your admit card', 'We’ll read your exam timetable and build a calm study plan around it.'],
      scanning: ['One moment…', 'Finding subjects, dates and times on your admit card.'],
      done: ['We found 3 exams', 'Sample result. Check they match your admit card, then continue.']
    };
    var exams = [
      { code: 'SE', day: 21, name: 'Software Engineering', meta: 'Wed · 2:00 PM' },
      { code: 'DAA', day: 22, name: 'Design and Analysis of Algorithm', meta: 'Thu · 2:00 PM' },
      { code: 'DDS', day: 23, name: 'Design of Data Structures', meta: 'Fri · 2:00 PM' }
    ].map(function (x, i) {
      return { day: x.day, name: x.name, meta: x.meta, isSE: x.code === 'SE', isDAA: x.code === 'DAA', isDDS: x.code === 'DDS', delay: (i * 120) + 'ms' };
    });
    return {
      title: titles[st][0], subtitle: titles[st][1],
      isIdle: st === 'idle', isScanning: st === 'scanning', isDone: st === 'done',
      exams: exams,
      start: function () {
        self.setState({ stage: 'scanning' });
        if (self.t) clearTimeout(self.t);
        self.t = setTimeout(function () { self.setState({ stage: 'done' }); }, 2400);
      },
      reset: function () { self.setState({ stage: 'idle' }); }
    };
  }
}
</script>
</body>
</html>
