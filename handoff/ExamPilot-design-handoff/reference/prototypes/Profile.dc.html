<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — Your details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDECE8}
a{color:#1B1B1F}a:hover{color:#000000}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1),background-color 160ms ease,color 160ms ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.97)}
.field{transition:box-shadow 180ms ease,background-color 180ms ease}
.field:focus-within{box-shadow:0 0 0 2px #1B1B1F;background:#FFFFFF}
.rise{opacity:0;animation:rise 480ms cubic-bezier(.05,.7,.1,1) forwards}
.d1{animation-delay:60ms}.d2{animation-delay:120ms}.d3{animation-delay:180ms}.d4{animation-delay:240ms}
.pop{animation:pop 320ms cubic-bezier(.2,.9,.25,1.2)}
.grow{transform-origin:left;animation:grow 600ms 200ms cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
input{font:inherit;color:inherit;border:0;outline:0;background:transparent;width:100%}
input::placeholder{color:#8E8996}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.rise{opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EDECE8; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">
<main style="padding: 60px 24px 32px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 14px">
<a href="Login.dc.html" class="press" aria-label="Back" style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
<span class="grow" style="height: 6px; border-radius: 999px; background: #1B1B1F"></span>
<span style="height: 6px; border-radius: 999px; background: #D9D5CD"></span>
<span style="height: 6px; border-radius: 999px; background: #D9D5CD"></span>
</div>
<span style="font-size: 14px; font-weight: 600; color: #5C5866">1 of 3</span>
</div>

<div class="rise" style="display: flex; align-items: center; gap: 16px; padding-top: 8px">
<span class="pop" style="flex: none; width: 72px; height: 72px; border-radius: 999px; background: #D6CDE6; color: #3E3557; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">{{initials}}</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; color: #5C5866">Your details</span>
<span style="font-size: 20px; font-weight: 600">{{hello}}</span>
</span>
</div>

<h1 class="rise d1" style="margin: 0; font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em">Tell us a little<br>about you</h1>

<div class="rise d2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label class="field" style="display: flex; flex-direction: column; gap: 4px; background: #F7F6F3; border-radius: 22px; padding: 12px 18px">
<span style="font-size: 13px; font-weight: 600; color: #5C5866">First name</span>
<input type="text" autocomplete="given-name" placeholder="First name" value="{{first}}" onChange="{{setFirst}}" style="font-size: 17px; height: 26px">
</label>
<label class="field" style="display: flex; flex-direction: column; gap: 4px; background: #F7F6F3; border-radius: 22px; padding: 12px 18px">
<span style="font-size: 13px; font-weight: 600; color: #5C5866">Surname</span>
<input type="text" autocomplete="family-name" placeholder="Surname" value="{{last}}" onChange="{{setLast}}" style="font-size: 17px; height: 26px">
</label>
</div>
<label class="rise d2 field" style="display: flex; flex-direction: column; gap: 4px; background: #F7F6F3; border-radius: 22px; padding: 12px 18px">
<span style="font-size: 13px; font-weight: 600; color: #5C5866">Student email</span>
<input type="email" autocomplete="email" placeholder="you@college.edu" style="font-size: 17px; height: 26px">
</label>
<label class="rise d3 field" style="display: flex; flex-direction: column; gap: 4px; background: #F7F6F3; border-radius: 22px; padding: 12px 18px">
<span style="font-size: 13px; font-weight: 600; color: #5C5866">College <span style="font-weight: 500; color: #77727F">(optional)</span></span>
<input type="text" autocomplete="organization" placeholder="Your university" style="font-size: 17px; height: 26px">
</label>

<div class="rise d3" role="group" aria-label="Semester" style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600; color: #5C5866">Semester</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{sems}}" as="s" hint-placeholder-count="6">
<sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><button type="button" class="press pop" onClick="{{s.pick}}" aria-pressed="true" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #1B1B1F; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{s.n}}</button></sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{true}}"><button type="button" class="press" onClick="{{s.pick}}" aria-pressed="false" style="width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #CFCAC1; background: transparent; color: #1B1B1F; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer">{{s.n}}</button></sc-if>
</sc-for>
</div>
</div>

<a class="rise d4 press" href="AdmitCard.dc.html" style="margin-top: 6px; display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 8px 0 28px; border-radius: 999px; background: #1B1B1F; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 600">
Continue
<span style="width: 46px; height: 46px; border-radius: 999px; background: #FFFFFF; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { first: '', last: '', sem: 5 };
  }
  renderVals() {
    var self = this;
    var f = this.state.first.trim(), l = this.state.last.trim();
    var ini = ((f[0] || '') + (l[0] || '')).toUpperCase();
    return {
      first: this.state.first, last: this.state.last,
      initials: ini || 'Hi',
      hello: f ? 'Nice to meet you, ' + f + '!' : 'Nice to meet you!',
      setFirst: function (e) { self.setState({ first: e.target.value }); },
      setLast: function (e) { self.setState({ last: e.target.value }); },
      sems: [3, 4, 5, 6, 7, 8].map(function (n) {
        return { n: n, on: self.state.sem === n, off: self.state.sem !== n, pick: function () { self.setState({ sem: n }); } };
      })
    };
  }
}
</script>
</body>
</html>
