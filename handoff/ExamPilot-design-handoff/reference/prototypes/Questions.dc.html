<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — Questions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDECE8}
a{color:#1B1B1F}a:hover{color:#000000}
.press{transition:transform 120ms cubic-bezier(.2,0,0,1),background-color 150ms ease}
.press:active{transform:scale(0.97)}
.pop{animation:pop 260ms cubic-bezier(.2,0,0,1)}
.fadeup{animation:fadeup 260ms cubic-bezier(.05,.7,.1,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.press:hover{transform:translateY(-1px)}.press:hover:active{transform:scale(.97)}
main{animation:pagein 360ms cubic-bezier(.2,.8,.2,1) both}
.tabpill{overflow:hidden;white-space:nowrap;animation:tabin 520ms cubic-bezier(.2,.9,.25,1.04) both}
.tablabel{animation:tablabel 320ms 180ms cubic-bezier(.05,.7,.1,1) both}
nav a:not(.tabpill){transition:background-color 180ms ease,transform 140ms cubic-bezier(.2,0,0,1)}
nav a:not(.tabpill):hover{background:#FFFFFF}
nav a:not(.tabpill):active{transform:scale(.92)}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tabin{from{max-width:56px}to{max-width:320px}}
@keyframes tablabel{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 1440px; position: relative; overflow: hidden; background: #EDECE8; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">
<main style="padding: 60px 20px 128px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 999px; background: #D6CDE6; color: #3E3557; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
<span style="display: flex; gap: 8px">
<button type="button" class="press" aria-label="Search questions" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: #FFFFFF; color: #1B1B1F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button type="button" class="press" aria-label="More" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: #FFFFFF; color: #1B1B1F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</span>
</div>

<header style="display: flex; flex-direction: column; gap: 6px; padding: 14px 4px 6px">
<span style="font-size: 20px; font-weight: 500; color: #5C5866">Sample question bank</span>
<h1 style="margin: 0; font-weight: 600; font-size: 46px; line-height: 1.02; letter-spacing: -0.03em">Important<br>Questions</h1>
</header>

<div role="group" aria-label="Filter by subject" style="display: flex; gap: 8px; align-items: center">
<span aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg></span>
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<sc-if value="{{f.on}}" hint-placeholder-val="{{false}}"><button type="button" class="press" onClick="{{f.pick}}" aria-pressed="true" style="height: 52px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #1B1B1F; background: #1B1B1F; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{f.label}}</button></sc-if>
<sc-if value="{{f.off}}" hint-placeholder-val="{{true}}"><button type="button" class="press" onClick="{{f.pick}}" aria-pressed="false" style="height: 52px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #CFCAC1; background: transparent; color: #1B1B1F; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer">{{f.label}}</button></sc-if>
</sc-for>
</div>

<div style="background: #D6CDE6; border-radius: 34px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #4A4260">Revised</span><span style="font-size: 46px; font-weight: 600; line-height: 1; letter-spacing: -0.03em">{{revisedCount}}<span style="font-size: 24px; color: #4A4260">/8</span></span></span>
<span style="max-width: 170px; text-align: right; font-size: 15px; line-height: 1.4; color: #3E3557">{{revisedMsg}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="8">
<sc-if value="{{g.on}}" hint-placeholder-val="{{true}}"><span class="pop" style="height: 6px; border-radius: 999px; background: #1B1B1F"></span></sc-if>
<sc-if value="{{g.off}}" hint-placeholder-val="{{false}}"><span style="height: 6px; border-radius: 999px; background: rgba(255,255,255,0.75)"></span></sc-if>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{questions}}" as="q" hint-placeholder-count="6">
<section class="fadeup" style="background: #FFFFFF; border-radius: 30px; overflow: hidden">
<h2 style="margin: 0">
<button type="button" class="press" onClick="{{q.toggle}}" aria-expanded="{{q.open}}" style="width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 18px 16px 18px 20px; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer">
<span style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span style="display: flex; gap: 8px; align-items: center; font-size: 13px">
<sc-if value="{{q.isSE}}" hint-placeholder-val="{{true}}"><span style="background: #D6CDE6; color: #3E3557; border-radius: 999px; padding: 3px 10px; font-weight: 600">SE</span></sc-if>
<sc-if value="{{q.isDAA}}" hint-placeholder-val="{{false}}"><span style="background: #EBD3D7; color: #6B3440; border-radius: 999px; padding: 3px 10px; font-weight: 600">DAA</span></sc-if>
<sc-if value="{{q.isDDS}}" hint-placeholder-val="{{false}}"><span style="background: #CFE6E0; color: #24524A; border-radius: 999px; padding: 3px 10px; font-weight: 600">DDS</span></sc-if>
<sc-if value="{{q.revised}}" hint-placeholder-val="{{false}}"><span class="pop" style="display: flex; align-items: center; gap: 4px; color: #1B1B1F; font-weight: 600"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Revised</span></sc-if>
</span>
<span style="font-size: 18px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em">{{q.q}}</span>
</span>
<sc-if value="{{q.open}}" hint-placeholder-val="{{false}}"><span style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #1B1B1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></span></sc-if>
<sc-if value="{{q.closed}}" hint-placeholder-val="{{true}}"><span style="flex: none; width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid #D9D5CD; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></sc-if>
</button>
</h2>
<sc-if value="{{q.open}}" hint-placeholder-val="{{false}}">
<div class="fadeup" style="padding: 0 16px 18px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; background: #F4F2EE; border-radius: 22px; padding: 14px 16px; font-size: 16px; line-height: 1.6; color: #1B1B1F">{{q.a}}</p>
<sc-if value="{{q.revised}}" hint-placeholder-val="{{false}}"><button type="button" class="press" onClick="{{q.mark}}" aria-pressed="true" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 999px; border: 0; background: #1B1B1F; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Revised</button></sc-if>
<sc-if value="{{q.notRevised}}" hint-placeholder-val="{{true}}"><button type="button" class="press" onClick="{{q.mark}}" aria-pressed="false" style="align-self: flex-start; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #CFCAC1; background: transparent; color: #1B1B1F; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Mark as revised</button></sc-if>
</div>
</sc-if>
</section>
</sc-for>
</div>

</main>

<nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px; background: rgba(255,255,255,0.78); border: 1px solid #FFFFFF; box-shadow: 0 12px 32px rgba(40,30,60,0.14)">
<a href="Main.dc.html" aria-label="Today" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: #F4F2EE; border: 1px solid #E4E1DA; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg></a>
<a href="Calendar.dc.html" aria-label="Calendar" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: #F4F2EE; border: 1px solid #E4E1DA; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg></a>
<a href="Subjects.dc.html" aria-label="Subjects" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: #F4F2EE; border: 1px solid #E4E1DA; box-sizing: border-box; color: #1B1B1F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="7" r="3.5"></circle><circle cx="17" cy="7" r="3.5"></circle><circle cx="7" cy="17" r="3.5"></circle><circle cx="17" cy="17" r="3.5"></circle></svg></a>
<a href="Questions.dc.html" aria-current="page" class="tabpill" style="flex: 1; height: 56px; border-radius: 999px; background: #1B1B1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 16px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="5"></rect><path d="M8 10h8M8 14h5"></path></svg><span class="tablabel">Questions</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1440}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All', open: 0, revised: [true, false, true, true, false, false, false, false] };
  }
  renderVals() {
    var self = this;
    var Q = [
      { s: 'SE', q: 'Compare the Waterfall and Agile process models.', a: 'Waterfall runs phases in a fixed order (requirements → design → build → test) and suits stable requirements, but problems surface late. Agile delivers in short iterations with continuous customer feedback, so it handles changing requirements well.' },
      { s: 'SE', q: 'What is the difference between verification and validation?', a: 'Verification: “are we building the product right?” — reviews, walkthroughs and inspections against the specification. Validation: “are we building the right product?” — testing the working software against user needs.' },
      { s: 'SE', q: 'Explain coupling and cohesion. Which should be high?', a: 'Cohesion is how closely related a module’s responsibilities are — aim for high. Coupling is how much modules depend on each other — aim for low. High cohesion and low coupling make code easier to change and test.' },
      { s: 'DAA', q: 'State the Master theorem and solve T(n) = 2T(n/2) + n.', a: 'For T(n) = aT(n/b) + f(n), compare f(n) with n^(log_b a). Here a = 2, b = 2, so n^(log₂2) = n, which matches f(n). That is case 2, giving T(n) = Θ(n log n).' },
      { s: 'DAA', q: 'Greedy vs dynamic programming — when does each work?', a: 'Greedy works when the problem has the greedy-choice property and optimal substructure; it makes one choice per step (e.g. activity selection). DP works when subproblems overlap; it stores sub-results to avoid recomputation (e.g. 0/1 knapsack).' },
      { s: 'DAA', q: 'Why does Dijkstra’s algorithm fail with negative edge weights?', a: 'It finalises a vertex as soon as it is removed from the queue, assuming no later path can be shorter. A negative edge can break that assumption. Bellman–Ford handles negative weights and detects negative cycles.' },
      { s: 'DDS', q: 'Explain the four rotations used to rebalance an AVL tree.', a: 'LL case → single right rotation. RR case → single left rotation. LR case → left rotation on the child, then right rotation. RL case → right rotation on the child, then left rotation. Afterwards every balance factor is −1, 0 or +1.' },
      { s: 'DDS', q: 'How does a hash table handle collisions?', a: 'Separate chaining keeps a list at each slot. Open addressing finds another slot by linear probing, quadratic probing or double hashing. Keeping the load factor low keeps average lookups close to O(1).' }
    ];
    var f = this.state.filter;
    var rev = this.state.revised;
    var n = rev.filter(Boolean).length;
    var filters = ['All', 'SE', 'DAA', 'DDS'].map(function (l) {
      return { label: l, on: f === l, off: f !== l, pick: function () { self.setState({ filter: l, open: -1 }); } };
    });
    var questions = [];
    Q.forEach(function (x, i) {
      if (f !== 'All' && x.s !== f) return;
      var open = self.state.open === i;
      questions.push({
        q: x.q, a: x.a, isSE: x.s === 'SE', isDAA: x.s === 'DAA', isDDS: x.s === 'DDS',
        open: open, closed: !open, revised: !!rev[i], notRevised: !rev[i],
        toggle: function () { self.setState({ open: open ? -1 : i }); },
        mark: function () { var r = self.state.revised.slice(); r[i] = !r[i]; self.setState({ revised: r }); }
      });
    });
    var msg = n === 8 ? 'All revised. Now rest and let it settle.' : n >= 4 ? 'Halfway! Each one makes the next easier.' : 'Answer from memory first, then peek.';
    return {
      filters: filters, questions: questions, revisedCount: n, revisedMsg: msg,
      segs: rev.map(function (r) { return { on: r, off: !r }; })
    };
  }
}
</script>
</body>
</html>
