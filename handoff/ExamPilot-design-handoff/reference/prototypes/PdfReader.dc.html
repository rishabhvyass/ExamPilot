<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExamPilot — PDF reader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDECE8}
a{color:#1B1B1F}a:hover{color:#000000}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1),background-color 160ms ease,opacity 160ms ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.95)}
.turnR{animation:turnR 420ms cubic-bezier(.2,.8,.2,1) both}
.turnL{animation:turnL 420ms cubic-bezier(.2,.8,.2,1) both}
.fill{transition:width 500ms cubic-bezier(.2,.8,.2,1)}
.rocket{transition:left 500ms cubic-bezier(.2,.8,.2,1)}
.mark{transition:background-color 300ms ease}
.cheer{animation:cheer 600ms cubic-bezier(.2,.9,.25,1.3) both}
.spark{position:absolute;width:10px;height:10px;border-radius:999px;opacity:0;animation:spark 900ms ease-out forwards}
.thumb{transition:transform 180ms ease,box-shadow 180ms ease}
.thumb:hover{transform:translateY(-3px)}
@keyframes turnR{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes turnL{from{opacity:0;transform:translateX(-40px) rotate(-2deg)}to{opacity:1;transform:none}}
@keyframes cheer{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
button:focus-visible,a:focus-visible{outline:3px solid #1B1B1F;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.spark{display:none}}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #EDECE8; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box; display: flex; flex-direction: column">

<header style="padding: 56px 20px 10px; display: flex; align-items: center; gap: 12px">
<a href="Materials.dc.html" class="press" aria-label="Back to materials" style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">SE_Unit3_Design_UML.pdf</span><span style="font-size: 14px; color: #5C5866">Software Engineering · sample PDF</span></span>
<button type="button" class="press" onClick="{{toggleHl}}" aria-pressed="{{hlPressed}}" aria-label="Highlight key line" style="flex: none; width: 52px; height: 52px; border-radius: 999px; border: 0; background: {{hlBtnBg}}; color: {{hlBtnFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l-5 5v3h3l5-5"></path><path d="M14 4l6 6-8 8-6-6z"></path></svg></button>
</header>

<div style="padding: 4px 20px 0; display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="position: relative; flex: 1; height: 28px; display: flex; align-items: center">
<span style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 999px; background: #DAD6CF"></span>
<span class="fill" style="position: absolute; left: 0; height: 6px; border-radius: 999px; background: #1B1B1F; width: {{pct}}"></span>
<span class="rocket" style="position: absolute; left: {{pct}}; margin-left: -14px; width: 28px; height: 28px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 10px rgba(40,30,60,.15); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2"></path><path d="M9 12a22 22 0 0 1 11-9c0 3-1 8-9 11z"></path><path d="M9 12H5l2-4h4M12 15v4l4-2v-4"></path></svg></span>
</div>
<span style="flex: none; font-size: 14px; font-weight: 600; color: #5C5866">{{page}} / 6</span>
</div>

<div style="flex: 1; position: relative; padding: 14px 20px 0; display: flex; flex-direction: column">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="1">
<sc-if value="{{p.active}}" hint-placeholder-val="{{true}}">
<article class="{{dirClass}}" aria-label="{{p.label}}" style="flex: 1; background: #FFFFFF; border-radius: 28px; box-shadow: 0 16px 40px rgba(40,30,60,.10); padding: 26px 24px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; color: #77727F">UNIT 3 · PAGE {{p.n}}</span>
<h2 style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em">{{p.title}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65">{{p.body}}</p>
<p style="margin: 0; font-size: 16px; line-height: 1.65"><span class="mark" style="background: {{hlBg}}; border-radius: 6px; padding: 1px 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone">{{p.key}}</span></p>
<sc-if value="{{p.hasDiagram}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; padding-top: 4px">
<div style="flex: 1; border: 1.5px solid #1B1B1F; border-radius: 12px; overflow: hidden; font-size: 13px"><div style="background: #D6CDE6; padding: 6px 8px; font-weight: 700">Student</div><div style="padding: 6px 8px; border-top: 1.5px solid #1B1B1F">name, rollNo</div><div style="padding: 6px 8px; border-top: 1.5px solid #1B1B1F">enrol()</div></div>
<span style="font-size: 13px; font-weight: 600; color: #5C5866">1..*</span>
<div style="flex: 1; border: 1.5px solid #1B1B1F; border-radius: 12px; overflow: hidden; font-size: 13px"><div style="background: #CFE6E0; padding: 6px 8px; font-weight: 700">Course</div><div style="padding: 6px 8px; border-top: 1.5px solid #1B1B1F">code, credits</div><div style="padding: 6px 8px; border-top: 1.5px solid #1B1B1F">addStudent()</div></div>
</div>
</sc-if>
<sc-if value="{{p.isLast}}" hint-placeholder-val="{{false}}">
<div class="cheer" role="status" style="position: relative; margin-top: auto; display: flex; align-items: center; gap: 12px; background: #D6CDE6; border-radius: 22px; padding: 14px 16px">
<sc-for list="{{sparks}}" as="s" hint-placeholder-count="8"><span class="spark" aria-hidden="true" style="{{s.style}}"></span></sc-for>
<span style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #1B1B1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">You finished this PDF!</span><span style="font-size: 14px; color: #4A4260">Want 5 quick questions from it?</span></span>
</div>
</sc-if>
</article>
</sc-if>
</sc-for>
</div>

<div style="padding: 14px 20px 0; display: flex; gap: 8px; justify-content: center" role="group" aria-label="Pages">
<sc-for list="{{pages}}" as="t" hint-placeholder-count="6">
<sc-if value="{{t.active}}" hint-placeholder-val="{{false}}"><button type="button" class="thumb" onClick="{{t.go}}" aria-label="{{t.label}}" aria-current="page" style="width: 40px; height: 54px; border-radius: 10px; border: 2px solid #1B1B1F; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px">{{t.n}}</button></sc-if>
<sc-if value="{{t.inactive}}" hint-placeholder-val="{{true}}"><button type="button" class="thumb" onClick="{{t.go}}" aria-label="{{t.label}}" style="width: 40px; height: 54px; border-radius: 10px; border: 1px solid #DAD6CF; background: #F7F6F3; font: inherit; font-size: 13px; color: #77727F; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px">{{t.n}}</button></sc-if>
</sc-for>
</div>

<div style="padding: 14px 20px 28px; display: flex; align-items: center; gap: 8px">
<button type="button" class="press" onClick="{{prev}}" aria-label="Previous page" style="flex: none; width: 56px; height: 56px; border-radius: 999px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{prevOpacity}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<a href="Assistant.dc.html" class="press" style="flex: 1; height: 56px; border-radius: 999px; background: #1B1B1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 16px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"></path></svg>Ask about this page</a>
<button type="button" class="press" onClick="{{next}}" aria-label="Next page" style="flex: none; width: 56px; height: 56px; border-radius: 999px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{nextOpacity}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 4, dir: 'R', hl: true };
  }
  renderVals() {
    var self = this;
    var P = [
      { title: 'Software design', body: 'Design turns requirements into a plan for the code: which modules exist, what each one does, and how they talk to each other.', key: 'Good design makes change cheap.' },
      { title: 'Design principles', body: 'Abstraction hides detail, modularity splits the system into parts, and information hiding keeps each part’s internals private.', key: 'Aim for small modules with clear jobs.' },
      { title: 'Cohesion and coupling', body: 'Cohesion measures how related a module’s responsibilities are. Coupling measures how much modules depend on one another.', key: 'High cohesion, low coupling.' },
      { title: 'UML class diagrams', body: 'A class box lists its name, attributes and operations. Lines between boxes show associations, with multiplicity at each end.', key: 'One student can enrol in many courses.', diagram: true },
      { title: 'Sequence diagrams', body: 'Objects sit along the top; time flows downward. Arrows show messages in the order they are sent.', key: 'Read sequence diagrams top to bottom.' },
      { title: 'Summary', body: 'Unit 3 links principles to diagrams: use class diagrams for structure and sequence diagrams for behaviour.', key: 'Practise drawing one of each before the exam.' }
    ];
    var cur = this.state.page;
    var pages = P.map(function (p, i) {
      var n = i + 1;
      return { n: n, title: p.title, body: p.body, key: p.key, hasDiagram: !!p.diagram, isLast: n === P.length, active: n === cur, inactive: n !== cur, label: 'Page ' + n + ': ' + p.title,
        go: function () { self.setState({ page: n, dir: n > self.state.page ? 'R' : 'L' }); } };
    });
    var colors = ['#8C7BB5', '#E9C4CC', '#BFE0D8', '#1B1B1F'];
    var sparks = [];
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      sparks.push({ style: 'left:32px;top:30px;background:' + colors[i % 4] + ';--x:' + Math.round(Math.cos(a) * 60) + 'px;--y:' + Math.round(Math.sin(a) * 40) + 'px;animation-delay:' + (200 + i * 30) + 'ms' });
    }
    return {
      pages: pages, sparks: sparks, page: cur,
      pct: Math.round(cur / P.length * 100) + '%',
      dirClass: this.state.dir === 'R' ? 'turnR' : 'turnL',
      hlBg: this.state.hl ? '#E9DFF7' : 'transparent',
      hlPressed: this.state.hl ? 'true' : 'false',
      hlBtnBg: this.state.hl ? '#1B1B1F' : '#FFFFFF',
      hlBtnFg: this.state.hl ? '#FFFFFF' : '#1B1B1F',
      toggleHl: function () { self.setState({ hl: !self.state.hl }); },
      prevOpacity: cur === 1 ? '0.4' : '1',
      nextOpacity: cur === P.length ? '0.4' : '1',
      prev: function () { if (self.state.page > 1) self.setState({ page: self.state.page - 1, dir: 'L' }); },
      next: function () { if (self.state.page < P.length) self.setState({ page: self.state.page + 1, dir: 'R' }); }
    };
  }
}
</script>
</body>
</html>
