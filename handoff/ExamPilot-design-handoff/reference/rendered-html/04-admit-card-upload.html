<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamPilot reference — 04-admit-card-upload</title>
<!-- Static snapshot of the design prototype (AdmitCard.dc.html) in its first state. Reference only: rebuild as React components. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#EDECE8}
a{color:#1B1B1F}a:hover{color:#000000}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1),background-color 160ms ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.97)}
.zone{transition:transform 200ms ease,box-shadow 200ms ease}
.zone:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(40,30,60,.10)}
.fadeup{animation:fadeup 420ms cubic-bezier(.05,.7,.1,1) both}
.s1{animation-delay:80ms}.s2{animation-delay:200ms}.s3{animation-delay:320ms}
.bob{animation:bob 2.4s ease-in-out infinite}
.scan{animation:scan 1.6s cubic-bezier(.45,0,.55,1) infinite alternate}
.dot{animation:dot 1.2s ease-in-out infinite}
.dot2{animation-delay:.15s}.dot3{animation-delay:.3s}
.shine{animation:shine 1.4s ease-in-out infinite}
.grow{transform-origin:left;animation:grow 600ms 200ms cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scan{from{top:8%}to{top:88%}}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes shine{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #1B1B1F;outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.scan{top:48%}}

</style>
</head>
<body>


<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #EDECE8; font-family: 'Urbanist', system-ui, sans-serif; color: #1B1B1F; box-sizing: border-box">
<main style="padding: 60px 24px 32px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 14px">
<a href="Profile.dc.html" class="press" aria-label="Back" style="flex: none; width: 52px; height: 52px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
<span style="height: 6px; border-radius: 999px; background: #1B1B1F"></span>
<span class="grow" style="height: 6px; border-radius: 999px; background: #1B1B1F"></span>
<span style="height: 6px; border-radius: 999px; background: #D9D5CD"></span>
</div>
<span style="font-size: 14px; font-weight: 600; color: #5C5866">2 of 3</span>
</div>

<header style="display: flex; flex-direction: column; gap: 8px; padding-top: 6px">
<h1 style="margin: 0; font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em">Add your admit card</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #5C5866">We’ll read your exam timetable and build a calm study plan around it.</p>
</header>


<div class="fadeup" style="display: flex; flex-direction: column; gap: 12px">
<label class="zone" style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 34px 20px 28px; border-radius: 34px; background: #FFFFFF; border: 2px dashed #CFCAC1; text-align: center">
<input class="vh" type="file" accept=".pdf,image/*">
<span class="bob" aria-hidden="true" style="width: 84px; height: 84px; border-radius: 999px; background: #D6CDE6; color: #3E3557; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg></span>
<span style="font-size: 20px; font-weight: 600">Upload admit card</span>
<span style="font-size: 15px; line-height: 1.5; color: #5C5866">PDF or a clear photo · up to 10 MB</span>
<span style="margin-top: 4px; height: 50px; padding: 0 24px; border-radius: 999px; background: #1B1B1F; color: #FFFFFF; display: flex; align-items: center; font-size: 16px; font-weight: 600">Choose file</span>
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label class="press" style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 999px; background: #FFFFFF; font-size: 16px; font-weight: 600">
<input class="vh" type="file" accept="image/*" capture="environment">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Take photo</label>
<button type="button" class="press" style="height: 56px; border-radius: 999px; border: 1.5px solid #CFCAC1; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #1B1B1F; cursor: pointer">Try a sample</button>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start; background: #CFE6E0; border-radius: 24px; padding: 14px 16px; font-size: 15px; line-height: 1.5; color: #24524A">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span>We only read subjects, dates and times. You confirm everything, and you can delete the file anytime.</span>
</div>
</div>






</main>
</div>

</body>
</html>
